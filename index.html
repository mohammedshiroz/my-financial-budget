  return {title:`Summary by ${REP_DIMS[group][0].toLowerCase()}${group2?' and '+REP_DIMS[group2][0].toLowerCase():''}`,cols,rows:out,foot:[mk('Total',T)]};
}
function repMonthlyModel(rows){
  const months=repMonths(rows), dim=REP.pivot, f=REP_DIMS[dim][1], ms=REP.measure;
  const val=r=>ms==='out'?(r.flow==='out'?r.lkr:0):ms==='in'?(r.flow==='in'?r.lkr:0):ms==='charge'?(r.flow==='charge'?r.lkr:0):(r.flow==='in'?r.lkr:r.flow==='out'?-r.lkr:0);
  const tot=new Map(); for(const r of rows){ const v=val(r); if(v) tot.set(f(r),(tot.get(f(r))||0)+v); }
  const ranked=[...tot.entries()].sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k])=>k);
  const keys=ranked.length>8?[...ranked.slice(0,7),'Others']:ranked, top=new Set(keys);
  const colOf=r=>{ const k=f(r); return top.has(k)?k:'Others'; };
  const grid=new Map(months.map(m=>[m,new Map()]));
  for(const r of rows){ const g=grid.get(r.ym); if(!g) continue; const v=val(r); if(!v) continue; const k=colOf(r); g.set(k,(g.get(k)||0)+v); }
  const cols=[{h:'Month',t:'s',w:1.3},...keys.map(k=>({h:String(repDimLabel(dim,k)),t:'m',w:1.2})),{h:'Total',t:'m',w:1.3}];
  const out=months.map(m=>{ const g=grid.get(m), vals=keys.map(k=>g.get(k)||0), t=sum(vals,x=>x);
    return {ym:m,c:[ymLabel(m),...vals.map(v=>v?repConv(v):null),repConv(t)],cls:ms==='net'?{[keys.length+1]:t<0?'neg':'pos'}:{}}; });
  const colTot=keys.map(k=>sum([...grid.values()],g=>g.get(k)||0)), all=sum(colTot,x=>x), n=Math.max(1,months.length);
  const foot=[{c:['Total',...colTot.map(repConv),repConv(all)]},{c:['Average per month',...colTot.map(v=>repConv(v/n)),repConv(all/n)]}];
  const mLabel={out:'money out',in:'money in',charge:'card charges & fees',net:'net (in − out)'}[ms];
  return {title:`Month by month — ${mLabel} by ${REP_DIMS[dim][0].toLowerCase()}`,cols,rows:out,foot,keys,grid,months};
}
/* bills, instalments, saving months and card statements that fall due in the period */
function repDuesModel(){
  const [from,to]=repRange(), t=today(), now=ymNow(), cap=ymAdd(now,1), books=repBooks(), out=[];
  const push=(b,o)=>{ const s=secOf(b); out.push({...o,b,sec:s.name,secIcon:s.icon,book:b.name,lkrDue:o.due*rate(o.cur),lkrPaid:o.paid*rate(o.cur),lkrLeft:o.left*rate(o.cur)}); };
  for(const b of books){
    if(b.type==='expense'){ const cache=new Map(), kOf=m=>cache.get(m)||(cache.set(m,expCalc(b,m)),cache.get(m)), cur=b.currency||'LKR';
      for(const l of (b.lines||[]).filter(l=>l.isBill)){
        const first=(b.txns||[]).filter(x=>x.lineId===l.id).map(x=>x.date.slice(0,7)).sort()[0];
        let a=[from.slice(0,7),l.startMonth||first||now].sort().pop(); let z=[to.slice(0,7),l.endMonth||'9999-12',cap].sort()[0];
        for(const m of ymRange(a,z).slice(-120)){ const r=kOf(m).rows.find(x=>x.l.id===l.id); if(!r||r.due<from||r.due>to) continue;
          // a "carried" remainder is already part of the next bill, so it is not counted twice
          push(b,{date:r.due,item:l.name,period:ymLabel(m)+(r.status==='carried'?` · ${fmt(Math.max(0,r.remaining),cur)} carried`:''),cur,due:r.budget+(r.carryIn||0),paid:r.spent,left:r.status==='carried'?0:Math.max(0,r.remaining),status:r.status,kind:'bill'}); } } }
    else if(b.type==='course') for(const it of b.items||[]){ if(!it.dueDate||it.dueDate<from||it.dueDate>to) continue; const k=calc(it);
      push(b,{date:it.dueDate,item:it.title,period:it.category||'',cur:it.currency||'LKR',due:it.waived?k.paid:+it.amount,paid:k.paid,left:k.remaining,status:k.status,kind:'course'}); }
    else if(b.type==='saving'){ const k=savCalc(b);
      for(const mo of k.months){ if(mo.due<from||mo.due>to) continue;
        push(b,{date:mo.due,item:k.chit?`Contribution ${mo.no}/${k.members}`:'Monthly saving',period:ymLabel(mo.ym),cur:k.cur,due:mo.planned,paid:mo.deposited,left:mo.short,status:mo.status,kind:'saving'}); } }
    else if(b.type==='debt'){ const k=debtCalc(b), mP=+(b.minPct??3);
      k.st.forEach((s,i)=>{ const due=s.dueDate||monthDay(ymAdd(s.date.slice(0,7),1),+b.dueDay||4); if(due<from||due>to) return;
        const nextSt=k.st[i+1]?.date||'9999-12-31', paid=sum(k.tx.filter(x=>x.type==='payment'&&x.date>s.date&&x.date<=nextSt),x=>+x.amount);
        const min=(s.minDue!=null&&s.minDue!=='')?+s.minDue:Math.round(s.closing*mP)/100, bal=+s.closing||0, latest=i===k.st.length-1;
        // the card balance rolls on, so each statement asks for its minimum — the latest one for your planned payment, like the card page
        const need=Math.min(bal,latest?planPay(b.planMode||'fixed+min',b.planAmount,bal,min):min);
        const status=paid>=need-0.005||bal<=0.005?'paid':due<t?'overdue':paid>0?'partial':dateStatus(false,false,due);
        push(b,{date:due,item:`Statement ${fmtDate(s.date)}`,period:`Balance ${fmt(bal,k.cur)}${latest?' · planned payment':' · minimum'}`,cur:k.cur,due:need,paid,left:Math.max(0,need-paid),status,kind:'debt'}); }); }
  }
  const lab=x=>(LABELS[x.kind==='bill'?'bill':x.kind==='saving'?'saving':x.kind==='debt'?'debt':'course'][x.status])||x.status;
  const keep=x=>REP.status==='open'?!['paid','waived','carried'].includes(x.status):REP.status==='overdue'?x.status==='overdue':REP.status==='paid'?['paid','waived'].includes(x.status):true;
  const list=out.filter(keep).filter(x=>repMatchQ([x.sec,x.book,x.item,x.period,lab(x)].join(' '))).sort((a,b)=>a.date.localeCompare(b.date)||a.book.localeCompare(b.book));
  const cols=[{h:'Due date',t:'d',w:1.05},{h:'Section',t:'s',w:1.25},{h:'Item',t:'s',w:1.5},{h:'Bill / payment',t:'s',w:1.7},{h:'Period',t:'s',w:1.1},

function cellText(c,v,row){

}

/* Styled "Are you sure?" dialog. Resolves true only when the user clicks the confirm button.
   Cancel is focused by default, so Enter / Esc / clicking outside never deletes anything. */
function askConfirm(msg,{title='Are you sure?',ok='Delete',danger=true}={}){
  return new Promise(res=>{
    const root=document.getElementById('confirm-root');
    root.innerHTML=`<div class="overlay" style="z-index:200"><div class="modal" role="alertdialog" aria-modal="true" style="width:min(480px,100%)">
      <header><h3>${danger?'⚠️ ':''}${esc(title)}</h3></header>
      <div class="body"><div style="white-space:pre-line;line-height:1.6">${esc(msg)}</div>${danger?'<div class="hint" style="color:var(--bad)">This cannot be undone.</div>':''}</div>
      <footer><span style="flex:1"></span><button type="button" class="btn" data-c="0">Cancel</button><button type="button" class="btn ${danger?'danger-solid':'primary'}" data-c="1">${esc(ok)}</button></footer></div></div>`;
    const done=v=>{ root.innerHTML=''; document.removeEventListener('keydown',key,true); res(v); };
    const key=e=>{ if(e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); done(false); } };
    document.addEventListener('keydown',key,true);
    root.querySelectorAll('[data-c]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); done(b.dataset.c==='1'); });
    root.querySelector('.overlay').onmousedown=e=>{ if(e.target===e.currentTarget) done(false); };
    root.querySelector('[data-c="0"]').focus();
  });
}
function modal({title,body,submit='Save',wide=false,onSubmit,onOpen,extraFoot='',onDelete=null}){
  const root=$('#modal-root');
  root.innerHTML=`<div class="overlay"><form class="modal ${wide?'wide':''}" novalidate>
    <header><h3>${title}</h3><button type="button" class="icon-btn" data-close>✕</button></header>
    <div class="body">${body}</div>
    <footer>${onDelete?'<button type="button" class="btn danger" data-mdel>🗑 Delete</button>':''}${extraFoot}<span style="flex:1"></span><button type="button" class="btn" data-close>Cancel</button>${submit?`<button class="btn primary" type="submit">${submit}</button>`:''}</footer></form></div>`;
  const form=root.querySelector('form');
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  root.querySelector('[data-mdel]')?.addEventListener('click',async()=>{ if(await onDelete()!==false){ closeModal(); render(); } });
  root.querySelector('.overlay').addEventListener('mousedown',e=>{ if(e.target.classList.contains('overlay')) closeModal(); });
  form.onsubmit=async e=>{ e.preventDefault(); const btn=form.querySelector('[type=submit]'); if(btn) btn.disabled=true;
    try{ const r=await onSubmit?.(form); if(r!==false){ closeModal(); render(); } }
    catch(err){ console.error(err); toast('Error: '+err.message); }
    finally{ if(btn) btn.disabled=false; } };
  onOpen?.(form);
  setTimeout(()=>form.querySelector('input:not([type=hidden]):not([type=file]):not([type=checkbox]):not([type=radio]),select,textarea')?.focus(),30);
  return form;
}
function closeModal(){ $('#modal-root').querySelectorAll('[data-objurl]').forEach(el=>URL.revokeObjectURL(el.dataset.objurl)); $('#modal-root').innerHTML=''; }
const val = (f,n) => f.elements[n]?.value?.trim() ?? '';
function wireDrop(zone,input,out){
  const show=()=>{ out.textContent=[...input.files].map(f=>`${f.name} (${fmtSize(f.size)})`).join(', '); zone.classList.toggle('over',input.files.length>0); };
  zone.onclick=e=>{ if(e.target!==input) input.click(); }; input.onchange=show;
  zone.ondragover=e=>{e.preventDefault();zone.classList.add('over');};
  zone.ondragleave=()=>{ if(!input.files.length) zone.classList.remove('over'); };
  zone.ondrop=e=>{e.preventDefault(); input.files=e.dataTransfer.files; show();};
}
/* receipt section reused by every payment/transaction modal */
function filesField(ids,label='Receipt / proof of payment'){
  const files=(ids||[]).map(id=>S.files.find(f=>f.id===id)).filter(Boolean);
  return `<div class="full"><label>${label}</label>
    ${files.length?`<div style="margin-bottom:6px">${files.map(f=>`<label class="chip"><input type="checkbox" name="keep" value="${f.id}" checked> <span>${esc(f.name)}</span></label>`).join('')}<div class="hint">Untick to remove a file.</div></div>`:''}
    <div class="drop" data-fdrop>📎 Click or drop receipt images / PDFs here<input type="file" name="files" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" hidden></div>

}
const wireFiles = f => { const z=f.querySelector('[data-fdrop]'); if(z) wireDrop(z,f.elements.files,f.querySelector('[data-fout]')); };
async function applyFiles(f,existing,meta){
  const keep=[...f.querySelectorAll('[name=keep]:checked')].map(x=>x.value);
  let drop=(existing||[]).filter(id=>!keep.includes(id));
  if(drop.length && !(await askConfirm(`You unticked ${drop.length} file(s):\n${drop.map(id=>'• '+(S.files.find(x=>x.id===id)?.name||'file')).join('\n')}\n\nDelete them permanently?`,{title:'Delete files?',ok:'Delete files'}))) drop=[];
  for(const id of drop) await deleteFileRaw(id);
  const kept=(existing||[]).filter(id=>!drop.includes(id));
  return kept.concat(await addFiles(f.elements.files.files,meta));
}

  </div>`,
  extraFoot: s?`<button type="button" class="btn danger" id="sec-del">🗑 Delete section</button>`:'',

    f.querySelectorAll('[data-icon]').forEach(c=>c.onclick=()=>{ f.elements.icon.value=c.dataset.icon; });

async function deleteFileRaw(id){
  await DB.del('files',id); S.files=S.files.filter(f=>f.id!==id);
  const strip=arr=>(arr||[]).filter(x=>x!==id);
  for(const b of S.books){
    for(const it of b.items||[]){ if(it.invoiceFiles) it.invoiceFiles=strip(it.invoiceFiles); for(const p of it.payments) p.files=strip(p.files); }
    for(const t of b.txns||[]) t.files=strip(t.files);
    for(const s of b.statements||[]) s.files=strip(s.files);
  }
}

/* ---------- export / import / csv ---------- */
const blobToDataURL = b => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); });
function dataURLToBlob(d){ const [h,b]=d.split(','); const mime=h.match(/:(.*?);/)[1]; const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); }
async function exportBackup(plain=false){
  if(plain){
    if(!(await askConfirm('An unencrypted backup is a normal readable file. Anyone who gets it can see all your courses, savings, expenses and open every receipt — no password needed.\n\nUse it only for moving data or keeping a copy somewhere you fully trust.',{title:'Export WITHOUT encryption?',ok:'Export unencrypted'}))) return;
    const pw=await askPassword('Enter your master password to confirm the unencrypted export.',{title:'Confirm it\'s you',ok:'Export'}); if(pw==null) return;
    try{ (await CRYPTO.unwrap(VAULT,pw)).fill(0); }catch{ return toast('Wrong password — export cancelled'); }
  }
  toast(plain?'Preparing unencrypted backup…':'Preparing encrypted backup…');
  const blobs={}; for(const f of S.files){ const b=await getFile(f.id); if(b) blobs[f.id]=await blobToDataURL(b); }
  S.settings.lastBackup=new Date().toISOString(); await save();
  if(plain){
    download(`my-financial-budget-backup-${today()}-UNENCRYPTED.json`,JSON.stringify({app:'edu-budget',encrypted:false,exported:S.settings.lastBackup,state:S,blobs}),'application/json');
    render(); toast('⚠️ Unencrypted backup downloaded — store it somewhere safe'); return;
  }
  const box=await CRYPTO.seal(CRYPTO.key,CRYPTO.enc.encode(JSON.stringify({state:S,blobs})));
  download(`my-financial-budget-backup-${today()}.json`,JSON.stringify({app:'edu-budget',encrypted:true,exported:S.settings.lastBackup,vault:VAULT,box}),'application/json');
  render(); toast('🔒 Encrypted backup downloaded — keep it in your OneDrive folder');
}
async function importBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch{ return toast('Not a valid backup file'); }
  if(data.app!=='edu-budget'||!(data.state||data.encrypted)) return toast('Not a My Financial Budget backup');
  let payload;
  if(data.encrypted){
    const pw=await askPassword('Enter the master password — or the recovery key — that was in use when this backup was made.',{title:'Unlock backup'}); if(pw==null) return;
    try{ const raw=await CRYPTO.unwrapAny(data.vault,pw), k=await CRYPTO.importDek(raw); raw.fill(0); payload=JSON.parse(CRYPTO.dec.decode(await CRYPTO.open(k,data.box))); }
    catch{ return toast('Wrong password or recovery key for this backup'); }
  } else payload={state:data.state,blobs:data.blobs};
  if(!(await askConfirm(`Restore the backup from ${data.exported?.slice(0,10)||'unknown date'}?\n\nThis REPLACES everything currently in this browser — all sections, payments, savings, expenses and files.`,{title:'Restore backup?',ok:'Replace & restore'}))) return;
  toast('Restoring…');
  await DB.clear('files'); for(const [id,d] of Object.entries(payload.blobs||{})) await putFile(id,dataURLToBlob(d));
  S=payload.state; migrate(); await save(); V.page='dashboard'; render(); toast('Backup restored and encrypted with your current master password');
}
function csvCourse(c){
  const rows=[['#','Item','Category','Due date','Currency','Amount','Paid','Balance','LKR equivalent','Status','Invoice no.','Invoice date','Paid dates','References','Notes']];
  sortItems(c.items).forEach((it,i)=>{ const k=calc(it); rows.push([i+1,it.title,it.category,it.dueDate,it.currency,it.amount,k.paid,k.remaining,Math.round(k.totalLKR),LABELS.course[k.status],it.invoiceNo||'',it.invoiceDate||'',it.payments.map(p=>p.date).join(' | '),it.payments.map(p=>p.ref).filter(Boolean).join(' | '),it.notes]); });
  downloadCSV(`${safeName(c.name)}-schedule-${today()}.csv`,rows);
}
function csvSaving(b){
  const rows=[['Date','Type','Amount','Currency','Method','Reference','Note']];
  [...b.txns].sort((x,y)=>x.date.localeCompare(y.date)).forEach(x=>rows.push([x.date,txnLabel(b,x.type),(x.type==='withdrawal'||x.type==='payout')?-x.amount:x.amount,b.currency||'LKR',x.method,x.ref,x.note]));
  downloadCSV(`${safeName(b.name)}-savings-${today()}.csv`,rows);
}
function csvExpense(b){
  const m=V.month, rows=[['Date','Budget line','Category','Amount','Currency','Method','Reference','Note']];
  b.txns.filter(x=>x.date.slice(0,7)===m).sort((x,y)=>x.date.localeCompare(y.date)).forEach(x=>{ const l=b.lines.find(l=>l.id===x.lineId); rows.push([x.date,l?l.name:'Unplanned',l?l.category:'',x.amount,b.currency||'LKR',x.method,x.ref,x.note]); });
  downloadCSV(`${safeName(b.name)}-${m}.csv`,rows);
}

/* ================= SECURITY: master password + encryption =================
   A random 256-bit data key (DEK) encrypts the state and every file (AES-GCM).
   The DEK is stored only wrapped (encrypted) by a key derived from the master password (PBKDF2-SHA256).
   Changing the password re-wraps the DEK; nothing else needs re-encrypting. */
const CRYPTO = {
  key:null, enc:new TextEncoder(), dec:new TextDecoder(),
  b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); },
  unb64(s){ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; },
  async kek(pw,salt,iter){
    const base=await crypto.subtle.importKey('raw',this.enc.encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  },
  async seal(key,bytes){ const iv=crypto.getRandomValues(new Uint8Array(12)); return {iv:this.b64(iv),ct:this.b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}; },
  async open(key,box){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:this.unb64(box.iv)},key,this.unb64(box.ct))); },
  importDek(raw){ return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']); },
  async createVault(pw){
    const raw=crypto.getRandomValues(new Uint8Array(32)), salt=crypto.getRandomValues(new Uint8Array(16)), iter=310000;
    const wrapped=await this.seal(await this.kek(pw,salt,iter),raw);
    const rk=newRecoveryKey(), recovery=await this.wrapRecovery(raw,rk);
    this.key=await this.importDek(raw); raw.fill(0);
    return {hdr:{v:1,kdf:'PBKDF2-SHA256',iter,salt:this.b64(salt),wrapped,recovery},rk};
  },
  async unwrap(hdr,pw){ return this.open(await this.kek(pw,this.unb64(hdr.salt),hdr.iter),hdr.wrapped); },   // throws on wrong password
  async wrapRecovery(raw,rk){ const salt=crypto.getRandomValues(new Uint8Array(16)), iter=200000;
    return {salt:this.b64(salt),iter,created:new Date().toISOString(),wrapped:await this.seal(await this.kek(normRK(rk),salt,iter),raw)}; },
  async unwrapRecovery(hdr,rk){ const r=hdr.recovery; if(!r) throw new Error('No recovery key'); return this.open(await this.kek(normRK(rk),this.unb64(r.salt),r.iter),r.wrapped); },
  async unwrapAny(hdr,secret){ try{ return await this.unwrap(hdr,secret); }catch(e){ if(hdr.recovery && normRK(secret).length===24) return this.unwrapRecovery(hdr,secret); throw e; } },
  encState(obj){ return this.seal(this.key,this.enc.encode(JSON.stringify(obj))); },
  async decState(key,box){ return JSON.parse(this.dec.decode(await this.open(key,box))); },
};
let VAULT=null;
/* recovery key: 24 chars from an unambiguous 32-letter alphabet = 120 random bits, shown as XXXX-XXXX-XXXX-XXXX-XXXX-XXXX */
const RK_ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newRecoveryKey(){ let s=''; for(const x of crypto.getRandomValues(new Uint8Array(24))) s+=RK_ALPHA[x&31]; return s.match(/.{4}/g).join('-'); }
const normRK = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');

function showRecoveryKey(rk,onDone,{title='Save your recovery key',intro=''}={}){
  gate(`<div class="lock"><div class="lock-card wide">
    <div class="lock-logo">🗝️</div><h1>${title}</h1>
    <p class="sub">${intro}If you ever forget your master password, this key is the <b>only</b> way to unlock your data. Keep it somewhere safe — a password manager, or printed on paper. Don't keep it in the same place as your backups.</p>
    <div class="rk-box">${rk}</div>
    <div class="toolbar" style="justify-content:center;margin:0"><button type="button" class="btn" id="rk-copy">📋 Copy</button><button type="button" class="btn" id="rk-dl">⬇ Download as .txt</button></div>
    <label class="lock-ack"><input type="checkbox" id="rk-ack"> I have saved my recovery key in a safe place.</label>
    <div class="lock-err" id="lock-err"></div>
    <button type="button" class="btn primary lock-btn" id="rk-done">Continue</button>
  </div></div>`);
  document.getElementById('rk-copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(rk); toast('Recovery key copied'); }catch{ toast('Copy failed — select the key and copy it manually'); } };
  document.getElementById('rk-dl').onclick=()=>download('My-Financial-Budget-RECOVERY-KEY.txt',`My Financial Budget — Recovery key\r\n\r\n${rk}\r\n\r\nCreated: ${new Date().toLocaleString()}\r\nUse it on the lock screen: "Forgot password?" → enter this key → choose a new password.\r\nKeep this file private and away from your backups.\r\n`,'text/plain');
  document.getElementById('rk-done').onclick=()=>{
    if(!document.getElementById('rk-ack').checked){ document.getElementById('lock-err').textContent='Please confirm you have saved the recovery key.'; shake(document.querySelector('.lock-card')); return; }
    onDone();
  };
}

function showRecover(vault){
  if(!vault.hdr.recovery){
    gate(`<div class="lock"><div class="lock-card"><div class="lock-logo">🗝️</div><h1>No recovery key</h1>
      <p class="sub">This data was encrypted before recovery keys existed, so a forgotten password cannot be recovered.</p>

async function putFile(id,blob){

async function getFile(id){

function pwStrength(p){ let s=0; if(p.length>=8) s++; if(p.length>=12) s++; if(/[a-z]/.test(p)&&/[A-Z]/.test(p)) s++; if(/\d/.test(p)) s++; if(/[^A-Za-z0-9]/.test(p)) s++; return Math.min(4,s); }

/* ================= ONEDRIVE DATA FILE (offline sync) =================
   The whole encrypted vault (header + encrypted state + already-encrypted files) is written to one JSON file
   in the OneDrive folder. OneDrive's own app syncs that file; this page never touches the network.
   PC (Chrome/Edge): File System Access API → automatic save + change detection.
   Phones / other browsers: open the file with a picker, save back via the share sheet or a download. */
const SYNC={meta:{mode:null,knownRev:0,dirty:false,lastSync:null,fileName:'',remoteDevice:''},handle:null,timer:null,applying:false,busy:false,needPerm:false};
const FSA = typeof window!=='undefined' && 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;
const DATA_NAME='My-Financial-Budget.data.json';
const FILE_TYPES=[{description:'My Financial Budget data file',accept:{'application/json':['.json']}}];
const deviceName=()=>{ const u=navigator.userAgent; return /Android/.test(u)?'Android phone':/iPhone|iPad|iPod/.test(u)?'iPhone / iPad':/Windows/.test(u)?'Windows PC':/Mac/.test(u)?'Mac':'another device'; };
const fmtDT = iso => { if(!iso) return '—'; const d=new Date(iso); return `${fmtDate(isoOf(d))} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function ago(iso){ if(!iso) return 'never'; const s=(Date.now()-new Date(iso))/1000; return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago':fmtDT(iso); }
async function loadSyncMeta(){ SYNC.meta={...SYNC.meta,...(await DB.get('kv','sync')||{})}; SYNC.handle=await DB.get('kv','sync-handle')||null; if(SYNC.meta.mode==='handle'&&!SYNC.handle) SYNC.meta.mode=null; }
const saveSyncMeta = () => DB.put('kv','sync',SYNC.meta);

async function buildDataFile(rev){
  const files={};
  for(const f of S.files){
    let r=await DB.get('files',f.id); if(!r) continue;
    if(r instanceof Blob){ await putFile(f.id,r); r=await DB.get('files',f.id); }
    files[f.id]={iv:CRYPTO.b64(r.iv),ct:CRYPTO.b64(r.data),type:r.type};
  }
  return JSON.stringify({app:'edu-budget',kind:'data-file',v:1,rev,saved:new Date().toISOString(),device:deviceName(),hdr:VAULT,box:await CRYPTO.encState(S),files});
}
function parseDataFile(text){
  let d; try{ d=JSON.parse(text); }catch{ throw new Error('This file is not a My Financial Budget data file'); }
  if(d.app!=='edu-budget'||d.kind!=='data-file'||!d.hdr||!d.box) throw new Error(d.app==='edu-budget'?'This is a backup file — restore it from Settings → Backup & restore':'This file is not a My Financial Budget data file');
  return d;
}
/* a key that can open this file: the current one if it matches, otherwise ask for its password / recovery key */
async function keyForFile(d){
  if(CRYPTO.key){ try{ await CRYPTO.decState(CRYPTO.key,d.box); return CRYPTO.key; }catch{} }
  const pw=await askPassword(`Enter the master password (or recovery key) of this data file — saved ${fmtDT(d.saved)} on ${d.device||'another device'}.`,{title:'Unlock data file'}); if(pw==null) return null;
  try{ const raw=await CRYPTO.unwrapAny(d.hdr,pw), k=await CRYPTO.importDek(raw); raw.fill(0); return k; }
  catch{ toast('Wrong password or recovery key'); return null; }
}
async function applyDataFile(d,key){
  SYNC.applying=true;
  try{
    S=await CRYPTO.decState(key,d.box); CRYPTO.key=key; VAULT=d.hdr;
    await DB.clear('files');
    for(const [id,x] of Object.entries(d.files||{})) await DB.put('files',id,{enc:1,iv:CRYPTO.unb64(x.iv),data:CRYPTO.unb64(x.ct).buffer,type:x.type});
    migrate(); await save(); await writeSession();
  }finally{ SYNC.applying=false; }
  Object.assign(SYNC.meta,{knownRev:d.rev||0,dirty:false,lastSync:new Date().toISOString(),remoteDevice:d.device||''}); await saveSyncMeta();
}
function markDirty(){
  if(!SYNC.meta.mode) return;
  SYNC.meta.dirty=true; saveSyncMeta(); updateSyncTile();
  if(LIVE()){ clearTimeout(SYNC.timer); SYNC.timer=setTimeout(()=>syncNow(),1500); }
}
async function ensurePerm(interactive){
  if(SYNC.meta.mode==='graph'){ const ok=!!(await msToken()); SYNC.needPerm=!ok; updateSyncTile(); return ok; }
  const h=SYNC.handle, o={mode:'readwrite'}; if(!h) return false;
  try{
    if(await h.queryPermission(o)==='granted'){ SYNC.needPerm=false; return true; }
    if(interactive && await h.requestPermission(o)==='granted'){ SYNC.needPerm=false; updateSyncTile(); return true; }
  }catch(e){ console.warn(e); }
  SYNC.needPerm=true; updateSyncTile(); return false;
}
async function readHandle(){ const f=await SYNC.handle.getFile(); return f.size ? parseDataFile(await f.text()) : null; }
async function writeHandle(text){ const w=await SYNC.handle.createWritable(); await w.write(text); await w.close(); }

/* two-way sync with the connected file (PC) or OneDrive online (iPhone) */
const LIVE = () => SYNC.meta.mode==='handle' || SYNC.meta.mode==='graph';
async function syncNow(interactive=false){
  if(SYNC.busy||!S||!LIVE()) return;
  if(SYNC.meta.mode==='graph' && !navigator.onLine){ updateSyncTile(); return; }
  if(!(await ensurePerm(interactive))){ if(SYNC.meta.mode==='graph') autoReauth(); return; }
  const graph=SYNC.meta.mode==='graph';
  SYNC.busy=true; updateSyncTile(); let again=true;
  try{
    if(graph && !SYNC.meta.dirty && SYNC.meta.eTag){ const m=await graphMeta(); if(m && m.eTag===SYNC.meta.eTag) return; }   // cheap "anything new?" check
    const remote = graph ? await graphRead() : await readHandle().catch(()=>null), rRev=remote?.rev||0;
    if(remote && rRev<=SYNC.meta.knownRev && !SYNC.meta.dirty){ await rememberETag(); return; }          // nothing new either side
    if(remote && rRev>SYNC.meta.knownRev){
      if(!SYNC.meta.dirty){ const k=await keyForFile(remote); if(k){ await applyDataFile(remote,k); await rememberETag(); render(); toast(`☁️ Updated with changes from ${remote.device}`); } else again=false; return; }
      const c=await askChoice(`The data file was changed on ${remote.device} (${fmtDT(remote.saved)}), and this device also has changes that are not in the file yet.`,{title:'Changes on two devices',a:'Use the file version (discard my changes)',b:'Keep my version (overwrite the file)'});
      if(c==='a'){ const k=await keyForFile(remote); if(k){ await applyDataFile(remote,k); await rememberETag(); render(); toast('Loaded the version from the data file'); } return; }
      if(c!=='b'){ again=false; return; }
    }
    const rev=Math.max(rRev,SYNC.meta.knownRev)+1, text=await buildDataFile(rev);
    const tag = graph ? await graphWrite(text) : (await writeHandle(text), SYNC.meta.eTag);
    Object.assign(SYNC.meta,{knownRev:rev,dirty:false,lastSync:new Date().toISOString(),eTag:tag||''}); await saveSyncMeta();
  }catch(e){
    console.error(e); again=false;
    if(e.auth){ SYNC.needPerm=true; autoReauth(); }
    else if(!(e instanceof TypeError)) toast('Could not sync the data file: '+e.message);   // TypeError = no connection → retry later quietly
  }
  finally{ SYNC.busy=false; updateSyncTile(); if(again && SYNC.meta.dirty){ clearTimeout(SYNC.timer); SYNC.timer=setTimeout(()=>syncNow(),1500); } }
}
async function syncStartup(interactive){
  updateSyncTile();
  if(PENDING_MS){ const m=PENDING_MS; PENDING_MS=null;
    if(m.error) toast('OneDrive sign-in: '+m.error);
    else if(m.intent==='connect'){ await connectGraph(); }
  }
  if(LIVE() && await ensurePerm(interactive)) syncNow();
  else if(SYNC.meta.mode==='graph') autoReauth();
  if(!syncStartup.armed){
    syncStartup.armed=true;
    const poke=()=>{ if(S&&LIVE()&&!SYNC.needPerm) syncNow(); };
    setInterval(poke,60000);
    addEventListener('focus',poke); addEventListener('online',poke);
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') poke(); else if(SYNC.meta.dirty&&SYNC.meta.mode==='graph') syncNow(); });
  }
}

/* ================= ONEDRIVE ONLINE SYNC (web / iPhone version only) =================
   Active only on https with a client ID (filled in by iPhone Web App/build.js). The PC file:// app never uses it.
   Sign-in: OAuth 2.0 authorization code + PKCE (no secrets). Only the encrypted data file is transferred. */
const MS_CLIENT_ID='d4a3df4f-b33c-4d72-8d8d-6dd26e447f8b';
const MS_AUTHORITY='https://login.microsoftonline.com/consumers/oauth2/v2.0';
const MS_SCOPE='offline_access Files.ReadWrite';
const GRAPH_ITEM='https://graph.microsoft.com/v1.0/me/drive/root:'+encodeURI('/My Financial Budget App/'+DATA_NAME);
const GRAPH_OK = typeof location!=='undefined' && location.protocol==='https:' && !!MS_CLIENT_ID;
let PENDING_MS=null;
const redirectUri = () => location.origin+location.pathname.replace(/index\.html$/,'');
const b64url = u8 => { let s=''; u8.forEach(c=>s+=String.fromCharCode(c)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const LS={get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} },del(k){ try{ localStorage.removeItem(k); }catch{} }};

async function msLogin(intent,{chooseAccount=false}={}){
  const verifier=b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge=b64url(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))));
  const state=b64url(crypto.getRandomValues(new Uint8Array(16)));
  LS.set('ms-pkce',{verifier,state,intent,at:Date.now()});
  const q=new URLSearchParams({client_id:MS_CLIENT_ID,response_type:'code',redirect_uri:redirectUri(),response_mode:'query',scope:MS_SCOPE,code_challenge:challenge,code_challenge_method:'S256',state});
  if(chooseAccount) q.set('prompt','select_account');
  location.assign(`${MS_AUTHORITY}/authorize?${q}`);
}
async function msTokenRequest(params){
  const r=await fetch(`${MS_AUTHORITY}/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:MS_CLIENT_ID,scope:MS_SCOPE,...params})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description?.split('\r\n')[0]||j.error||'Sign-in failed');
  const auth={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+((j.expires_in||3600)-120)*1000};
  await DB.put('kv','ms-auth',auth); return auth;
}
/* back from the Microsoft sign-in page? swap the code for tokens */
async function msHandleRedirect(){
  const p=new URLSearchParams(location.search); if(!p.has('code')&&!p.has('error')) return null;
  const pk=LS.get('ms-pkce'); LS.del('ms-pkce'); history.replaceState(null,'',redirectUri());
  if(p.has('error')) return {error:p.get('error_description')||p.get('error'),intent:pk?.intent};
  if(!pk||pk.state!==p.get('state')) return {error:'Sign-in could not be verified — please try again.'};
  try{ await msTokenRequest({grant_type:'authorization_code',code:p.get('code'),redirect_uri:redirectUri(),code_verifier:pk.verifier}); LS.del('ms-auto'); return {ok:true,intent:pk.intent}; }
  catch(e){ return {error:e.message,intent:pk.intent}; }
}
async function msToken(){
  let a=await DB.get('kv','ms-auth'); if(!a) return null;
  if(a.exp>Date.now()) return a.access;
  if(!navigator.onLine) return a.access;   // offline: let the request fail quietly, retry later
  try{ a=await msTokenRequest({grant_type:'refresh_token',refresh_token:a.refresh}); return a.access; }catch{ return null; }
}
async function gFetch(url,opt={}){
  const t=await msToken(); if(!t) throw Object.assign(new Error('Sign in to OneDrive again'),{auth:true});
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});
  if(r.status===401){ await DB.del('kv','ms-auth'); throw Object.assign(new Error('Sign in to OneDrive again'),{auth:true}); }
  return r;
}
async function graphMeta(){ const r=await gFetch(GRAPH_ITEM+'?select=eTag,lastModifiedDateTime,size'); if(r.status===404) return null; if(!r.ok) throw new Error('OneDrive error '+r.status); return r.json(); }
async function graphRead(){ const r=await gFetch(GRAPH_ITEM+':/content'); if(r.status===404) return null; if(!r.ok) throw new Error('OneDrive error '+r.status); const t=await r.text(); return t.trim()?parseDataFile(t):null; }
async function graphWrite(text){
  const blob=new Blob([text],{type:'application/json'});
  if(blob.size<4e6){
    const r=await gFetch(GRAPH_ITEM+':/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:blob});
    if(!r.ok) throw new Error('OneDrive upload failed ('+r.status+')'); return (await r.json()).eTag;
  }
  const s=await gFetch(GRAPH_ITEM+':/createUploadSession',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:{'@microsoft.graph.conflictBehavior':'replace'}})});
  if(!s.ok) throw new Error('OneDrive upload failed ('+s.status+')');
  const {uploadUrl}=await s.json(), CH=320*1024*10; let res;
  for(let i=0;i<blob.size;i+=CH){
    const part=blob.slice(i,i+CH);
    res=await fetch(uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${i}-${i+part.size-1}/${blob.size}`},body:part});
    if(!res.ok) throw new Error('OneDrive upload failed ('+res.status+')');
  }
  return (await res.json()).eTag;
}
async function rememberETag(){ if(SYNC.meta.mode==='graph'){ try{ SYNC.meta.eTag=(await graphMeta())?.eTag||''; await saveSyncMeta(); }catch{} } }
/* connect this device to OneDrive sync (after sign-in) */
async function connectGraph(){
  try{
    const remote=await graphRead();
    SYNC.handle=null; Object.assign(SYNC.meta,{mode:'graph',fileName:'OneDrive › My Financial Budget App'});
    if(remote){
      const same = CRYPTO.key && await CRYPTO.decState(CRYPTO.key,remote.box).then(()=>true,()=>false);
      if(!same || remote.rev>SYNC.meta.knownRev){
        if(!(await askConfirm(`Load your data from OneDrive (saved ${fmtDT(remote.saved)} on ${remote.device})?\n\nThe data on this device will be replaced by the OneDrive version.`,{title:'Use OneDrive data?',ok:'Load from OneDrive',danger:false}))){ SYNC.meta.mode=null; await saveSyncMeta(); return; }
        const k=await keyForFile(remote); if(!k){ SYNC.meta.mode=null; await saveSyncMeta(); return; }
        await applyDataFile(remote,k);
      }
      await rememberETag();
    } else { SYNC.meta.knownRev=0; SYNC.meta.dirty=true; }
    await saveSyncMeta(); await syncNow(); render(); toast('☁️ OneDrive connected — changes now sync automatically');
  }catch(e){ toast('OneDrive: '+e.message); }
}
/* new phone: sign in, then open the data file straight from OneDrive */
async function openFromOneDriveAtStart(){
  let d; try{ d=await graphRead(); }catch(e){ return toast('OneDrive: '+e.message); }
  if(!d) return toast('No data file found in OneDrive › My Financial Budget App');
  const k=await keyForFile(d); if(!k) return;
  SYNC.handle=null; Object.assign(SYNC.meta,{mode:'graph',fileName:'OneDrive › My Financial Budget App'});
  await applyDataFile(d,k); await rememberETag();
  gate(''); await startApp(true); toast(`☁️ Opened from OneDrive — saved ${fmtDT(d.saved)} on ${d.device}`);
}
function autoReauth(){
  const last=+(LS.get('ms-auto')||0);
  if(Date.now()-last<10*60000||!navigator.onLine){ SYNC.needPerm=true; updateSyncTile(); return; }
  LS.set('ms-auto',Date.now()); toast('Reconnecting to OneDrive…'); setTimeout(()=>msLogin('reauth'),900);
}

/* pick a file: real file handle on PC, plain picker elsewhere */
async function pickDataFile(){
  if(FSA){ const [handle]=await showOpenFilePicker({types:FILE_TYPES,multiple:false}); const f=await handle.getFile(); return {handle,file:f}; }
  return new Promise((res,rej)=>{ const i=document.createElement('input'); i.type='file'; i.onchange=()=>i.files[0]?res({handle:null,file:i.files[0]}):rej(new Error('No file chosen')); i.click(); });
}
async function connectHandle(handle){ SYNC.handle=handle; await DB.put('kv','sync-handle',handle); SYNC.meta.mode='handle'; SYNC.meta.fileName=handle.name; SYNC.needPerm=false; }
/* new device: open the data file from the setup screen */
async function openExistingAtStart(){
  let picked; try{ picked=await pickDataFile(); }catch(e){ if(e.name!=='AbortError') toast(e.message); return; }
  let d; try{ d=parseDataFile(await picked.file.text()); }catch(e){ return toast(e.message); }
  const k=await keyForFile(d); if(!k) return;
  if(picked.handle) await connectHandle(picked.handle); else Object.assign(SYNC.meta,{mode:'manual',fileName:picked.file.name});
  await applyDataFile(d,k);
  gate(''); await startApp(true); toast(`📂 Opened data file — saved ${fmtDT(d.saved)} on ${d.device}`);
}
/* PC: create a new data file in the OneDrive folder from this device's data */
async function createDataFile(){
  if(!FSA) return toast('Use “Save data file” on this device');
  let handle; try{ handle=await showSaveFilePicker({suggestedName:DATA_NAME,types:FILE_TYPES}); }catch(e){ if(e.name!=='AbortError') toast(e.message); return; }
  await connectHandle(handle); SYNC.meta.knownRev=0; SYNC.meta.dirty=true; await saveSyncMeta();
  await syncNow(true); render(); toast('☁️ Data file created — it now saves automatically');
}
/* connect to / load an existing data file (replaces this device's data with the file's) */
async function openDataFile(){
  let picked; try{ picked=await pickDataFile(); }catch(e){ if(e.name!=='AbortError') toast(e.message); return; }
  const text=await picked.file.text();
  if(!text.trim() && picked.handle){ await connectHandle(picked.handle); SYNC.meta.knownRev=0; SYNC.meta.dirty=true; await saveSyncMeta(); await syncNow(true); render(); return; }
  let d; try{ d=parseDataFile(text); }catch(e){ return toast(e.message); }
  if(!(await askConfirm(`Load the data file saved ${fmtDT(d.saved)} on ${d.device}?\n\nThe data currently on this device will be replaced by the file's data.${SYNC.meta.dirty?'\n\n⚠ This device has changes that were not saved to a data file yet.':''}`,{title:'Open data file?',ok:'Load data file',danger:SYNC.meta.dirty}))) return;
  const k=await keyForFile(d); if(!k) return;
  if(picked.handle) await connectHandle(picked.handle); else Object.assign(SYNC.meta,{mode:'manual',fileName:picked.file.name});
  await applyDataFile(d,k); V.page='dashboard'; render(); toast('📂 Data file loaded');
}
/* phones / no auto-save: hand the file to the share sheet (choose OneDrive) or download it */
async function saveDataFileManual(){
  const rev=SYNC.meta.knownRev+1, text=await buildDataFile(rev);
  const file=new File([text],DATA_NAME,{type:'application/json'});
  try{
    if(navigator.canShare?.({files:[file]})) await navigator.share({files:[file],title:'My Financial Budget data'});
    else download(DATA_NAME,text,'application/json');
  }catch(e){
    if(e.name==='AbortError') return toast('Not saved');
    if(e.name==='NotAllowedError'){   // iPhone: the share sheet needs a fresh tap after the file was prepared
      const shared=await new Promise(res=>modal({title:'💾 Save data file',submit:'Share…',
        body:`<p>Your data file is ready.</p><p class="sub">Tap <b>Share…</b>, then <b>Save to Files</b> → <b>OneDrive</b> → <b>My Financial Budget App</b> → <b>Replace</b>.</p>`,
        onSubmit:async()=>{ try{ await navigator.share({files:[file],title:'My Financial Budget data'}); res(true); }catch(x){ res(x.name!=='AbortError'?(download(DATA_NAME,text,'application/json'),true):false); } }}));
      if(!shared) return toast('Not saved');
    } else download(DATA_NAME,text,'application/json');
  }
  Object.assign(SYNC.meta,{mode:SYNC.meta.mode||'manual',knownRev:rev,dirty:false,lastSync:new Date().toISOString()}); await saveSyncMeta(); updateSyncTile(); render();
  toast(navigator.canShare?'Choose OneDrive and replace the old data file':'Downloaded — move it into your OneDrive folder, replacing the old one');
}
async function disconnectDataFile(){
  if(!(await askConfirm('Stop syncing with the data file? Your data stays on this device and the file stays in OneDrive.',{title:'Disconnect data file?',ok:'Disconnect',danger:false}))) return;
  SYNC.meta={mode:null,knownRev:0,dirty:false,lastSync:null,fileName:'',remoteDevice:''}; SYNC.handle=null; await DB.del('kv','sync-handle'); await DB.del('kv','ms-auth'); await saveSyncMeta(); render();
}
function syncState(){
  const m=SYNC.meta;
  if(!m.mode) return {cls:'off',icon:'☁️',t:'Not synced',s:'Set up OneDrive data file',act:'go" data-page="settings'};
  if(m.mode==='graph'){
    if(SYNC.needPerm) return {cls:'warn',icon:'⚠️',t:'Sign in to OneDrive',s:'Tap to reconnect sync',act:'ms-reauth'};
    if(!navigator.onLine) return {cls:m.dirty?'warn':'off',icon:'📴',t:m.dirty?'Offline — will sync later':'Offline',s:'OneDrive · automatic',act:'sync-now'};
    if(SYNC.busy||m.dirty) return {cls:'busy',icon:'🔄',t:'Syncing with OneDrive…',s:'Automatic',act:'sync-now'};
    return {cls:'',icon:'✅',t:'Synced · '+ago(m.lastSync),s:'OneDrive · automatic',act:'sync-now'};
  }
  if(m.mode==='handle'){
    if(SYNC.needPerm) return {cls:'warn',icon:'⚠️',t:'Reconnect data file',s:'Tap to allow saving',act:'sync-reconnect'};
    if(SYNC.busy||m.dirty) return {cls:'busy',icon:'🔄',t:'Saving to OneDrive…',s:m.fileName,act:'sync-now'};
    return {cls:'',icon:'✅',t:'Synced · '+ago(m.lastSync),s:m.fileName,act:'sync-now'};
  }
  if(m.dirty) return {cls:'warn',icon:'💾',t:'Unsaved changes',s:'Tap to save data file',act:'sync-save'};
  return {cls:'',icon:'✅',t:'Saved to file · '+ago(m.lastSync),s:'Tap ☁️ to load latest',act:'sync-save'};
}
function syncTileHTML(){ const x=syncState(); return `<div class="sync-tile ${x.cls}" data-act="${x.act}" title="${esc(x.t)}"><span class="ni">${x.icon}</span><span class="nl"><b>${esc(x.t)}</b><small>${esc(x.s||'')}</small></span></div>`; }
function updateSyncTile(){
  const el=document.getElementById('sync-tile'); if(el) el.innerHTML=syncTileHTML();
  const b=document.getElementById('mn-sync'); if(b){ const x=syncState(); b.textContent=x.icon; b.className='icon-btn '+(x.cls==='warn'?'warn':''); b.title=x.t; }
}
function syncSettingsHTML(){
  const m=SYNC.meta;
  const status = !m.mode ? '<b>Not set up.</b> Your data is only in this browser.'
    : m.mode==='graph' ? `<b>OneDrive connected</b> — syncs automatically · ${SYNC.needPerm?'<b class="neg">sign-in needed</b>':m.dirty?'syncing…':'synced '+ago(m.lastSync)} · revision ${m.knownRev}`
    : m.mode==='handle' ? `<b>Connected:</b> ${esc(m.fileName)} · ${SYNC.needPerm?'<b class="neg">needs reconnect</b>':m.dirty?'saving…':'saved '+ago(m.lastSync)} · revision ${m.knownRev}`
    : `<b>Manual file mode</b> (this device can't auto-save) · ${m.dirty?'<b class="neg">unsaved changes</b>':'last saved/loaded '+ago(m.lastSync)}`;
  return `<p class="sub">Keep one <b>encrypted</b> data file (<code>${DATA_NAME}</code>) in your OneDrive folder. OneDrive syncs it; this app never goes online. Open it on any PC or phone with your master password.</p>
  <div class="banner" style="background:var(--panel2);color:var(--text);border-color:var(--line)">${status}</div>
  <div class="toolbar">
    ${FSA?`<button class="btn primary" data-act="sync-create">☁️ Create data file in OneDrive folder</button><button class="btn" data-act="sync-open">📂 Connect existing data file</button>${m.mode==='handle'?'<button class="btn" data-act="sync-now">🔄 Sync now</button>':''}`
      :`${GRAPH_OK?(m.mode==='graph'?'<button class="btn primary" data-act="sync-now">🔄 Sync now</button>':'<button class="btn primary" data-act="ms-connect">☁️ Connect OneDrive (automatic sync)</button>'):''}<button class="btn" data-act="sync-open">📂 Open data file</button><button class="btn" data-act="sync-save">💾 Save data file</button>`}
    ${m.mode?'<button class="btn danger" data-act="sync-off">Disconnect</button>':''}
  </div>
  <div class="grid two" style="margin-top:6px"><div class="sub"><b>On this PC</b> (Chrome / Edge): click <i>Create data file</i> and save it inside <code>OneDrive › My Financial Budget App</code> (next to this app). After that every change is saved automatically. Opening another PC? Use <i>Connect existing data file</i>.</div>
  <div class="sub"><b>On your phone:</b> open the Home Screen app → <i>☁️ Open my data from OneDrive</i> → sign in with Microsoft → log in. Everything then syncs automatically. (Without signing in: <i>📂 I already have a data file</i> (or Settings → Open data file) → pick <code>${DATA_NAME}</code> from OneDrive → log in. After making changes tap <b>💾 Save data file</b> → choose <b>OneDrive</b> → replace the old file.)</div></div>`;
}
/* 3-choice dialog */
function askChoice(msg,{title='Choose',a='A',b='B'}={}){
  return new Promise(res=>{
    const root=document.getElementById('confirm-root');
    root.innerHTML=`<div class="overlay" style="z-index:200"><div class="modal" style="width:min(520px,100%)"><header><h3>⚠️ ${esc(title)}</h3></header>
      <div class="body"><div style="white-space:pre-line;line-height:1.6">${esc(msg)}</div></div>
      <footer style="flex-direction:column;align-items:stretch"><button class="btn" data-c="a">${esc(a)}</button><button class="btn primary" data-c="b">${esc(b)}</button><button class="btn" data-c="">Cancel</button></footer></div></div>`;
    root.querySelectorAll('[data-c]').forEach(x=>x.onclick=e=>{ e.stopPropagation(); root.innerHTML=''; res(x.dataset.c||null); });
  });
}

/* ================= SESSION =================
   After unlocking, the (non-extractable) data key is kept in IndexedDB together with the time of the
   last activity, so reloading / reopening the page does not ask for the password again.
   The session ends on Log out, or after S.settings.autoLock minutes without any interaction (0 = until log out). */
const SESSION = {last:Date.now(), wrote:0, timer:null};
const sessMinutes = () => +(S?.settings.autoLock ?? 45);
async function writeSession(){ SESSION.wrote=Date.now(); await DB.put('kv','session',{key:CRYPTO.key,last:SESSION.last,timeout:sessMinutes()}); }
async function logout(reason){
  clearTimeout(SESSION.timer);
  try{ await DB.del('kv','session'); }catch{}
  if(reason) try{ sessionStorage.setItem('fb-msg',reason); }catch{}
  CRYPTO.key=null; S=null; location.reload();
}
const lockNow = () => logout();
function armAutoLock(){
  const schedule=()=>{ clearTimeout(SESSION.timer); const m=sessMinutes(); if(m>0) SESSION.timer=setTimeout(()=>logout(`You were logged out after ${m} minutes without activity.`),m*60000); };
  const activity=()=>{ SESSION.last=Date.now(); schedule(); if(Date.now()-SESSION.wrote>20000) writeSession(); };
  ['mousemove','keydown','click','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,activity,{passive:true}));
  armAutoLock.reset=()=>{ schedule(); writeSession(); updateSessionTile(); };
  schedule(); writeSession();
  setInterval(updateSessionTile,15000);
}
function sessionLeftText(){
  const m=sessMinutes(); if(!m) return 'Until you log out';
  const left=Math.max(0,m*60000-(Date.now()-SESSION.last)), mins=Math.ceil(left/60000);
  return mins>=60 ? `${Math.floor(mins/60)} h ${mins%60} min left` : `${mins} min left`;
}
function updateSessionTile(){ const el=document.getElementById('sess-left'); if(el) el.textContent=sessionLeftText(); }
async function startApp(interactive=false){
  await loadSyncMeta();
  S.settings.autoLock ??= 45;
  if(!S.migrations?.session45){ S.settings.autoLock=45; (S.migrations ||= {}).session45=true; }
  if(migrate()) await save(); else await save();
  navigator.storage?.persist?.();
  SESSION.last=Date.now();
  render();
  armAutoLock();
  syncStartup(interactive);
  setInterval(()=>{ if(S && !$('#modal-root').innerHTML) render(); },60*60*1000);
  new MutationObserver(async()=>{ updateSessionTile(); const el=$('#storage-info'); if(el&&el.textContent==='Checking…'&&navigator.storage?.estimate){ const s=await navigator.storage.estimate(); el.textContent=`Using ${fmtSize(s.usage||0)} of about ${fmtSize(s.quota||0)} available · ${S.files.length} encrypted file(s)`; } }).observe($('#main'),{childList:true});
}
/* resume a still-valid session without asking for the password */
async function resumeSession(vault){
  const s=await DB.get('kv','session'); if(!s||!s.key) return false;
  const expired = s.timeout>0 && Date.now()-s.last > s.timeout*60000;
  if(expired){ await DB.del('kv','session'); try{ sessionStorage.setItem('fb-msg',`Your session expired after ${s.timeout} minutes without activity.`); }catch{} return false; }
  try{ CRYPTO.key=s.key; VAULT=vault.hdr; S=await CRYPTO.decState(CRYPTO.key,vault.box); await startApp(); return true; }
  catch{ CRYPTO.key=null; S=null; await DB.del('kv','session'); return false; }
}

/* offline: cache the app on the device after the first open */
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ================= BOOT ================= */
(async function(){
  document.documentElement.dataset.theme = UI.theme || 'light';
  try{
    if(!window.crypto?.subtle) throw new Error('This browser cannot do secure encryption for local files. Please open it in Chrome or Edge.');
    await DB.open();
    PENDING_MS = GRAPH_OK ? await msHandleRedirect() : null;
    const vault=await DB.get('kv','vault');
    if(vault){ if(!(await resumeSession(vault))) showLock(vault); }
    else {
      showSetup(await DB.get('kv','state'));
      if(PENDING_MS?.intent==='open-start'){ const m=PENDING_MS; PENDING_MS=null; if(m.error) toast('OneDrive sign-in: '+m.error); else openFromOneDriveAtStart(); }
    }
  }catch(err){
    console.error(err);
    gate(`<div class="lock"><div class="lock-card"><div class="lock-logo">⚠️</div><h1>Cannot start</h1><p class="sub">${esc(err.message)}</p></div></div>`);
  }
})();
</script>
