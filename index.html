  --accent:#4f6bed; --accent-weak:#e8ecfd; --ok:#1f9d63; --ok-weak:#e3f5ec; --warn:#c98a00; --warn-weak:#fdf3dc;

}
html[data-theme="dark"]{
  --bg:#11141b; --panel:#1a1f2a; --panel2:#151a23; --line:#2a3140; --text:#e6e9f0; --muted:#9099ad;
  --accent:#7b91ff; --accent-weak:#252d4d; --ok:#3cc488; --ok-weak:#17322a; --warn:#e7b03b; --warn-weak:#352c15;
  --bad:#ff7070; --bad-weak:#3a1d20; --info:#5aa8ea; --info-weak:#16293b; --gray-weak:#252a35;
  --c-course:#7b91ff; --c-sav:#3cc488; --c-exp:#f0954a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:var(--sbw,268px) 1fr;min-height:100vh;transition:grid-template-columns .22s ease}
.app.collapsed{--sbw:74px}
aside{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;z-index:20}
.sb-head{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--line);min-height:66px}
.sb-head .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7b5cf0);color:#fff;display:grid;place-items:center;font-size:17px;flex:none;box-shadow:0 4px 12px rgba(79,107,237,.35)}
.sb-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.sb-title b{display:block;font-size:15px} .sb-title small{color:var(--muted);font-size:11.5px}
.sb-toggle{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:14px;transition:transform .22s}
.sb-toggle:hover{color:var(--accent);border-color:var(--accent)}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 16px}
.sb-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px;white-space:nowrap;font-weight:600}
.nav-item,.nav-group-h{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap;user-select:none;margin:1px 0;transition:background .15s,color .15s}
.nav-item:hover,.nav-group-h:hover{background:var(--panel2)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(79,107,237,.32)}
.ni{width:24px;text-align:center;flex:none;font-size:16px;line-height:1}
.nl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nb{font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 7px;border-radius:99px;background:var(--gray-weak);color:var(--muted)}
.nb.bad{background:var(--bad);color:#fff}
.gear{opacity:0;font-size:13px;color:var(--muted);padding:2px 5px;border-radius:6px;transition:opacity .15s}
.gear:hover{background:var(--line);color:var(--text)}
.nav-group-h:hover .gear{opacity:1}
.chev{font-size:10px;color:var(--muted);transition:transform .2s;width:12px;text-align:center}
.nav-group.open > .nav-group-h .chev{transform:rotate(90deg)}
.nav-group.has-active > .nav-group-h{color:var(--accent);font-weight:600}
.nav-group.has-active > .nav-group-h .nb:not(.bad){background:var(--accent-weak);color:var(--accent)}
.nav-children{display:none;margin:2px 0 8px 22px;padding-left:10px;border-left:2px solid var(--line)}
.nav-group.open > .nav-children{display:block;animation:fade .18s}
.nav-sub{position:relative;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--text);cursor:pointer;text-decoration:none;margin:1px 0}
.nav-sub:hover{background:var(--panel2)}
.nav-sub.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav-sub.active::before{content:'';position:absolute;left:-12px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.nav-sub.add{color:var(--muted);font-size:12.5px}
.nav-sub .dot{width:9px;height:9px;border-radius:50%;flex:none}
.nav-sub .mini{flex:1;min-width:0}
.nav-sub .mini .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.nav-sub .mini .bar{height:3px;margin-top:4px}
.sb-foot{border-top:1px solid var(--line);padding:10px;display:grid;gap:2px}
.sb-foot .nav-item{font-size:13px;padding:8px 10px}
.sync-tile{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:4px;border-radius:10px;border:1px solid var(--line);white-space:nowrap;cursor:pointer;background:var(--ok-weak)}
.sync-tile .nl b{display:block;font-size:12px} .sync-tile .nl small{color:var(--muted);font-size:11.5px}
.sync-tile.warn{background:var(--warn-weak);border-color:var(--warn)} .sync-tile.off{background:var(--panel2)} .sync-tile.busy{background:var(--info-weak)}
.app.collapsed .sync-tile{justify-content:center;padding:8px 0}
#mn-sync.warn{animation:pulse 1.4s infinite} @keyframes pulse{50%{opacity:.35}}
.lock-alt{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.sess-tile{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:2px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.sess-tile .nl b{display:block;font-size:12px} .sess-tile .nl small{color:var(--muted);font-size:11.5px}
.app.collapsed .sess-tile{justify-content:center;padding:8px 0}
.sb-foot .ok-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none} .sb-foot .warn-dot{background:var(--warn)}
/* collapsed rail */
.app.collapsed .nl,.app.collapsed .nb,.app.collapsed .chev,.app.collapsed .gear,.app.collapsed .sb-title,.app.collapsed .nav-children,.app.collapsed .sb-foot .ok-dot{display:none}
.app.collapsed .sb-label{font-size:0;padding:10px 0 4px;margin:0 14px;border-top:1px solid var(--line)}
.app.collapsed .sb-head{flex-direction:column;padding:14px 8px;gap:12px}
.app.collapsed .sb-toggle{transform:rotate(180deg)}
.app.collapsed .nav-item,.app.collapsed .nav-group-h{justify-content:center;padding:10px 0}
.app.collapsed .nav-group.has-active > .nav-group-h{background:var(--accent-weak)}
.app.collapsed .nav-group-h .nb.bad{display:block;position:absolute;top:5px;right:12px;min-width:0;width:9px;height:9px;padding:0;font-size:0;border:2px solid var(--panel)}
main{padding:24px 28px 60px;min-width:0}

<script>
'use strict';
/* =========================================================
   My Financial Budget — offline, single file
   Sections: Courses · Saving Plans · Monthly Expenses
   Data: IndexedDB (state JSON + file blobs) in this browser
   ========================================================= */

const CUR_SYM = {LKR:'Rs ',QAR:'QAR ',GBP:'£',USD:'$',EUR:'€',AUD:'A$',CAD:'C$',INR:'₹'};
const CURRENCIES = Object.keys(CUR_SYM);
const COURSE_CATS = ['Application Fee','Registration','Course Fee','University Fee','Exam Fee','Other'];
const EXP_CATS = ['Housing / Rent','Food & Groceries','Transport','Utilities','Phone & Internet','Subscriptions','Loan / EMI','Insurance','Health','Personal','Family','Entertainment','Education','Other'];
const EXP_TEMPLATE = [
  ['Rent / Boarding','Housing / Rent',true,5],['Food & Groceries','Food & Groceries'],['Transport / Fuel','Transport'],
  ['Electricity','Utilities',true,15],['Water','Utilities',true,15],['Mobile & Internet','Phone & Internet',true,10],
  ['Subscriptions','Subscriptions'],['Health & Medicine','Health'],['Personal Care','Personal'],['Family Support','Family'],
  ['Entertainment / Eating out','Entertainment'],['Other','Other']];
const METHODS = ['Online Bank Transfer','Bank Transfer','Cash','Card','Online Payment','Cheque','Standing Order','Other'];
const DOC_TYPES = ['Receipt','Invoice','Bill','Bank Statement','Offer Letter','Agreement','Transcript','Certificate','ID / Personal','Other'];
const COLORS = ['#4f6bed','#1f9d63','#d9822b','#c2410c','#8b5cf6','#0891b2','#db2777','#64748b'];
/* Section TYPES (behaviour). Users create any number of sections of these types. */
const KINDS = {
  course: {label:'Payment schedule', icon:'📋', desc:'Fixed amounts due on set dates, with invoices & receipts — courses, loans, leasing, insurance, agreements…'},
  saving: {label:'Saving plan',      icon:'🏦', desc:'A target amount with a monthly contribution plan — deposits, withdrawals, interest & projection.'},
  expense:{label:'Monthly budget',   icon:'🧾', desc:'Budget lines and fixed bills tracked every month — household, personal, business…'},
  debt:   {label:'Credit card / Loan', icon:'💳', desc:'A balance that grows with interest each statement — record statements and payments of any amount, see your debt-free date and compare repayment plans.'},
};
const ICONS = ['🎓','🏦','🧾','📋','🏠','🚗','🏍️','💳','📱','💡','🏥','✈️','💼','🛒','👨‍👩‍👧','🎁','📈','🕌','🐾','🎯'];
const DEFAULT_SECTIONS = [
  {name:'Courses',icon:'🎓',kind:'course',itemName:'course',cats:COURSE_CATS},
  {name:'Saving Plans',icon:'🏦',kind:'saving',itemName:'saving plan'},
  {name:'Monthly Expenses',icon:'🧾',kind:'expense',itemName:'expense budget',cats:EXP_CATS}];
const LABELS = {
  course:{paid:'Paid',partial:'Partially paid',overdue:'Overdue','due-soon':'Due soon',upcoming:'Pending',waived:'Waived'},
  saving:{paid:'Saved',partial:'Partly saved',overdue:'Missed','due-soon':'Due soon',upcoming:'Planned',waived:'Target reached'},
  bill:{carried:'Carried to next bill',paid:'Paid',partial:'Part paid',overdue:'Overdue','due-soon':'Due soon',upcoming:'Pending',waived:'—'},
  budget:{ok:'Within budget',over:'Over budget',unused:'Nothing spent',tracked:'Tracking (no limit)'},
};
const TXN_LABEL = {deposit:'Deposit',withdrawal:'Withdrawal',interest:'Interest / profit',payout:'Payout received',payment:'Payment',charge:'New spending',fee:'Bank fee'};
LABELS.debt = {paid:'Paid',partial:'Part paid',overdue:'Overdue','due-soon':'Due soon',upcoming:'Upcoming',none:'No statement yet'};
LABELS.payout = {paid:'Received','due-soon':'Due this month',upcoming:'Upcoming',overdue:'Not received yet'};
/* Group saving = Seettu / chit fund (ROSCA): everyone pays the same each month, one member takes the whole pot each month */
const isChit = b => b.type==='saving' && b.mode==='chit';
const txnLabel = (b,type) => isChit(b) && type==='deposit' ? 'Contribution' : TXN_LABEL[type];
const txnTypes = b => isChit(b) ? ['deposit','payout'] : ['deposit','interest','withdrawal'];

/* ---------- IndexedDB ---------- */
const DB = {
  db:null,
  memory:false,
  open(){ return new Promise(res=>{
    try{
      const r = indexedDB.open('edu-budget-db',1);
      r.onupgradeneeded = () => { const d=r.result; d.createObjectStore('kv'); d.createObjectStore('files'); };
      r.onsuccess = () => { this.db=r.result; res(); };
      r.onerror = () => { this.useMemory(); res(); };
    }catch{ this.useMemory(); res(); }
  });},
  useMemory(){   // temporary storage only — data comes from / goes to the OneDrive data file
    const mem={kv:new Map(),files:new Map()}; this.memory=true;
    this.get=async(s,k)=>mem[s].get(k); this.put=async(s,k,v)=>{ mem[s].set(k,v); }; this.del=async(s,k)=>{ mem[s].delete(k); }; this.clear=async s=>mem[s].clear();
  },
  tx(store,mode,fn){ return new Promise((res,rej)=>{
    const t=this.db.transaction(store,mode); const s=t.objectStore(store); const q=fn(s);
    t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error);
  });},
  get(store,key){ return this.tx(store,'readonly',s=>s.get(key)); },
  put(store,key,val){ return this.tx(store,'readwrite',s=>s.put(val,key)); },
  del(store,key){ return this.tx(store,'readwrite',s=>s.delete(key)); },
  clear(store){ return this.tx(store,'readwrite',s=>s.clear()); },
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = (arr,f) => arr.reduce((a,x)=>a+(f(x)||0),0);
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const parse = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (iso,n) => { const d=parse(iso); d.setDate(d.getDate()+n); return isoOf(d); };
function addMonths(iso,n){
  const [y,m,d]=iso.split('-').map(Number);
  const t=new Date(y,m-1+n,1); const dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  t.setDate(Math.min(d,dim)); return isoOf(t);
}
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = iso => { if(!iso) return '—'; const d=parse(iso); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const ymNow = () => today().slice(0,7);
const ymAdd = (ym,n) => addMonths(ym+'-01',n).slice(0,7);
const ymLabel = ym => { const [y,m]=ym.split('-'); return `${MON[m-1]} ${y}`; };
const ymShort = ym => { const [y,m]=ym.split('-'); return `${MON[m-1]} ${y.slice(2)}`; };
function monthDay(ym,day){ const [y,m]=ym.split('-').map(Number); const dim=new Date(y,m,0).getDate(); return `${ym}-${pad(Math.min(Math.max(1,+day||1),dim))}`; }
function ymRange(a,b){ const r=[]; for(let m=a;m<=b&&r.length<600;m=ymAdd(m,1)) r.push(m); return r; }
function relDate(iso){
  if(!iso) return ''; const n=diffDays(today(),iso);
  if(n===0) return 'today'; if(n===1) return 'tomorrow'; if(n===-1) return 'yesterday';
  return n>0 ? `in ${n} days` : `${-n} days ago`;
}
function fmt(n,cur='LKR',dec){
  n=+n||0; const d = dec ?? (Math.round(n)===n?0:2);
  return (n<0?'-':'')+(CUR_SYM[cur]??cur+' ')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
/* country-wise dashboard: every item belongs to a country (default from its currency); a country view shows that
   country's items in that country's currency (other currencies converted) */
const COUNTRIES = {
  LK:{name:'Sri Lanka',flag:'🇱🇰',cur:'LKR'}, QA:{name:'Qatar',flag:'🇶🇦',cur:'QAR'}, GB:{name:'United Kingdom',flag:'🇬🇧',cur:'GBP'},
  US:{name:'United States',flag:'🇺🇸',cur:'USD'}, IN:{name:'India',flag:'🇮🇳',cur:'INR'}, AU:{name:'Australia',flag:'🇦🇺',cur:'AUD'},
  CA:{name:'Canada',flag:'🇨🇦',cur:'CAD'}, EU:{name:'Europe',flag:'🇪🇺',cur:'EUR'} };
const CUR_COUNTRY = {LKR:'LK',QAR:'QA',GBP:'GB',USD:'US',INR:'IN',AUD:'AU',CAD:'CA',EUR:'EU'};
const countryOf = b => (b.country && COUNTRIES[b.country]) ? b.country : (CUR_COUNTRY[b.type==='course'?'LKR':(b.currency||'LKR')]||'LK');
const DASH = {active:false, cur:'ALL', country:'ALL'};
const dashOK = b => !DASH.active || DASH.country==='ALL' || countryOf(b)===DASH.country;
const fmtLKR = n => (DASH.active && DASH.cur!=='ALL' && DASH.cur!=='LKR') ? fmt(Math.round(n/rate(DASH.cur)*100)/100, DASH.cur) : fmt(Math.round(n),'LKR',0);
const countryLabel = c => `${COUNTRIES[c].flag} ${COUNTRIES[c].name}`;
const fmtSize = b => b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
const ordinal = n => n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]||'th');
const opts = (arr,sel) => arr.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('');
const dot = (color,size=9) => `<span style="display:inline-block;width:${size}px;height:${size}px;border-radius:50%;background:${esc(color)};vertical-align:middle"></span>`;
const pctBar = (pct,cls='') => `<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`;
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function download(name,content,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(content instanceof Blob?content:new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
function downloadCSV(name,rows){ const q=v=>`"${String(v??'').replace(/"/g,'""')}"`; download(name,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv'); }
const safeName = s => s.replace(/[^\w]+/g,'-');

/* ---------- state ---------- */
let S = null;
const V = {page:'dashboard', bookId:null, tab:null, open:new Set(), filter:{status:'',cat:'',q:''}, docFilter:'', docSection:'', month:null, lineFilter:''};
const book = id => S.books.find(b=>b.id===id);
const booksOf = type => S.books.filter(b=>b.type===type && dashOK(b));
const sec = id => S.sections.find(s=>s.id===id);
const secOf = b => sec(b.sectionId) || {id:'',name:KINDS[b.type].label,icon:KINDS[b.type].icon,kind:b.type,itemName:'item'};
const booksIn = sid => S.books.filter(b=>b.sectionId===sid && dashOK(b));
const catsFor = b => { const c=secOf(b).cats; return c&&c.length ? c : (b.type==='course'?COURSE_CATS:EXP_CATS); };
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const rate = cur => cur==='LKR' ? 1 : (+S.settings.rates[cur]||0);
let saveChain=Promise.resolve();
function save(){
  saveChain=saveChain.catch(()=>{}).then(async()=>{
    if(!CRYPTO.key||!VAULT||!S) throw new Error('Locked');
    await DB.put('kv','vault',{hdr:VAULT,box:await CRYPTO.encState(S)});
    if(!SYNC.applying) markDirty();
  });
  return saveChain;
}

function defaultState(){
  return { version:2, settings:{rates:{QAR:82,GBP:400,USD:300,EUR:340,AUD:195,CAD:215,INR:3.5}, ratesUpdated:today(), dueSoonDays:7, theme:'light', lastBackup:null},
    books:[], files:[], migrations:{bscDue8:true,addAws:true} };
}

function seedBsc(){ return null; }
function seedAws(){ return null; }
/* upgrade older saved data (v1 = courses only) — payments/files untouched */
function migrate(){
  let ch=false;
  S.migrations ||= {}; S.files ||= []; S.settings ||= defaultState().settings; S.settings.rates ||= {};
  if(S.courses && !S.books){ S.books=S.courses.map(c=>({type:'course',...c})); delete S.courses; ch=true; }
  S.books ||= [];
  if(!S.sections){ S.sections=DEFAULT_SECTIONS.map(s=>({id:uid(),...s,cats:s.cats?[...s.cats]:undefined})); ch=true; }
  for(const b of S.books) if(!b.sectionId || !sec(b.sectionId)){
    let s=S.sections.find(x=>x.kind===b.type);
    if(!s){ s={id:uid(),name:KINDS[b.type].label,icon:KINDS[b.type].icon,kind:b.type,itemName:'item'}; S.sections.push(s); }
    b.sectionId=s.id; ch=true;
  }
  for(const f of S.files) if(!f.bookId && f.courseId){ f.bookId=f.courseId; ch=true; }
  for(const b of S.books){
    if(b.type==='course') b.items ||= [];
    if(b.type==='saving') b.txns ||= [];
    if(b.type==='expense'){ b.lines ||= []; b.txns ||= []; }
    if(b.type==='debt'){ b.statements ||= []; b.txns ||= []; }
  }
  if(S.version!==2){ S.version=2; ch=true; }
  S.migrations.momSeettu=true;
  if(!S.migrations.renameChit){
    
    S.migrations.renameChit=true; ch=true;
  }
  if(!S.migrations.householdsV1){ reorganiseHouseholds(); S.migrations.householdsV1=true; ch=true; }
  if(S.settings.rates.QAR==null){ S.settings.rates.QAR=82; ch=true; }
  S.migrations.bankCardV1=true;
  return ch;
}

/* Monthly budgets: keep ONE monthly-budget section ("Monthly Expenses"), one budget per household inside it.
   Other monthly-budget sections (e.g. "Monthly Billing") are removed — their budgets are MOVED in, never deleted. */
function reorganiseHouseholds(){
  const expSecs=S.sections.filter(s=>s.kind==='expense');
  let target=expSecs.find(s=>/^monthly expenses$/i.test(s.name.trim()))||expSecs[0];
  if(!target){ target={id:uid(),name:'Monthly Expenses',icon:'🧾',kind:'expense',cats:[...EXP_CATS]}; S.sections.push(target); }
  target.name='Monthly Expenses'; target.itemName='household';
  for(const s of expSecs) if(s!==target){
    const own=booksIn(s.id);
    // a section that was used as a household (e.g. "Mom Home") with one budget → that budget becomes the household
    if(own.length===1 && !/billing|bills?$/i.test(s.name) && !own.some(b=>b.name.toLowerCase()===s.name.toLowerCase())) own[0].name=s.name;
    for(const b of own) b.sectionId=target.id;
    S.sections=S.sections.filter(x=>x!==s);
  }
  for(const name of ['Personal','Mom Home','My Home'])
    if(!booksIn(target.id).some(b=>b.name.trim().toLowerCase()===name.toLowerCase()))
      S.books.push({id:uid(),type:'expense',sectionId:target.id,name,currency:'LKR',income:0,color:COLORS[S.books.length%COLORS.length],created:new Date().toISOString(),notes:'',lines:[],txns:[]});
}

/* move a budget line (with all its recorded expenses and receipts) to another monthly budget */
function moveLineModal(bid,lid){
  const from=book(bid), l=from.lines.find(x=>x.id===lid), tx=from.txns.filter(t=>t.lineId===lid);
  const targets=S.books.filter(b=>b.type==='expense'&&b.id!==bid);
  if(!targets.length) return toast('Add another household first');
  modal({title:`Move "${esc(l.name)}"`,submit:'Move',body:`<div class="form">
    <div class="full"><label>Move to</label><select name="to">${S.sections.filter(s=>s.kind==='expense').map(s=>`<optgroup label="${s.icon} ${esc(s.name)}">${targets.filter(b=>b.sectionId===s.id).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</optgroup>`).join('')}</select></div>
    <div class="full sub">Moves the budget line${l.isBill?' (fixed bill, due day '+l.dueDay+')':''} and its <b>${tx.length}</b> recorded expense(s) with their receipts. Nothing is deleted.</div></div>`,
  async onSubmit(f){
    const to=book(val(f,'to')); if(!to) return false;
    from.lines=from.lines.filter(x=>x!==l); to.lines.push(l);
    const ids=new Set(tx.map(t=>t.id));
    from.txns=from.txns.filter(t=>!ids.has(t.id)); to.txns.push(...tx);
    for(const fl of S.files) if(fl.bookId===from.id && ids.has(fl.txnId)) fl.bookId=to.id;
    await save(); toast(`Moved "${l.name}" to ${to.name}`);
  }});
}

/* ---------- shared status logic ---------- */
function dateStatus(done,any,due){
  const t=today();
  if(done) return 'paid';
  if(due<t) return 'overdue';
  if(any) return 'partial';
  if(due<=addDays(t,S.settings.dueSoonDays)) return 'due-soon';
  return 'upcoming';
}
const badge = (status,kind,extra='') => `<span class="badge b-${status}">${LABELS[kind][status]}${extra}</span>`;

/* ================= COURSES ================= */
function calc(it){
  const r = rate(it.currency);
  const paid = sum(it.payments,p=>+p.amount);
  const paidLKR = sum(it.payments,p=>(+p.amount)*(it.currency==='LKR'?1:(+p.rate||r)));
  const remaining = it.waived ? 0 : Math.max(0, +it.amount - paid);
  const remainingLKR = remaining*r;
  const status = it.waived ? 'waived' : dateStatus(remaining<0.005, paid>0, it.dueDate||'9999');
  const lastPaid = it.payments.map(p=>p.date).sort().pop()||null;
  return {paid,paidLKR,remaining,remainingLKR,totalLKR:paidLKR+remainingLKR,status,partial:paid>0&&remaining>0.005,lastPaid};
}
function addNext(o,date,entry){
  if(o.next && date>o.next.dueDate) return;
  if(!o.next || date<o.next.dueDate) o.next={dueDate:date,entries:[],lkr:0,byCur:{}};
  o.next.entries.push(entry); o.next.lkr+=entry.k.remainingLKR;
  o.next.byCur[entry.it.currency]=(o.next.byCur[entry.it.currency]||0)+entry.k.remaining;
}
const nextAmounts = n => Object.entries(n.byCur).sort(([a],[b])=>(b==='LKR')-(a==='LKR')).map(([cur,v])=>fmt(v,cur)).join(' + ');
function courseCalc(c){
  const o={totalLKR:0,paidLKR:0,balLKR:0,overdueLKR:0,overdueN:0,soonLKR:0,soonN:0,monthLKR:0,doneN:0,n:c.items.length,byCur:{},next:null};
  const t=today(), in30=addDays(t,30), eom=monthDay(ymNow(),31);
  for(const it of c.items){
    const k=calc(it);
    o.totalLKR+=k.totalLKR; o.paidLKR+=k.paidLKR; o.balLKR+=k.remainingLKR;
    if(k.status==='overdue'){o.overdueLKR+=k.remainingLKR;o.overdueN++;}
    if(k.remaining>0 && it.dueDate>=t && it.dueDate<=in30){o.soonLKR+=k.remainingLKR;o.soonN++;}
    if(k.remaining>0 && it.dueDate<=eom) o.monthLKR+=k.remainingLKR;
    if(k.status==='paid'||k.status==='waived') o.doneN++;
    const b=o.byCur[it.currency]||(o.byCur[it.currency]={total:0,paid:0,bal:0});
    b.total+= it.waived ? k.paid : +it.amount; b.paid+=k.paid; b.bal+=k.remaining;
    if(k.remaining>0 && k.status!=='overdue' && it.dueDate) addNext(o,it.dueDate,{it,k,book:c});
  }
  o.pct = o.totalLKR ? Math.round(o.paidLKR/o.totalLKR*100) : 0;
  return o;
}
function allCourseCalc(sid){
  const o={totalLKR:0,paidLKR:0,balLKR:0,overdueLKR:0,overdueN:0,soonLKR:0,soonN:0,monthLKR:0,next:null,byCur:{}};
  for(const c of booksOf('course').filter(b=>!sid||b.sectionId===sid)){ const k=courseCalc(c);
    ['totalLKR','paidLKR','balLKR','overdueLKR','overdueN','soonLKR','soonN','monthLKR'].forEach(f=>o[f]+=k[f]);
    for(const [cur,b] of Object.entries(k.byCur)){ const t=o.byCur[cur]||(o.byCur[cur]={total:0,paid:0,bal:0}); t.total+=b.total;t.paid+=b.paid;t.bal+=b.bal; }
    if(k.next) for(const e of k.next.entries) addNext(o,k.next.dueDate,e);
  }
  o.pct = o.totalLKR ? Math.round(o.paidLKR/o.totalLKR*100) : 0;
  return o;
}
const sortItems = items => [...items].sort((a,b)=>(a.dueDate||'9').localeCompare(b.dueDate||'9') || COURSE_CATS.indexOf(a.category)-COURSE_CATS.indexOf(b.category));
const courseBadge = k => badge(k.status,'course',k.status==='overdue'&&k.partial?' · part paid':'');
function amountCell(amount,cur,lkr){ return `${fmt(amount,cur)}${cur!=='LKR'?`<div class="sub">≈ ${fmtLKR(lkr)}</div>`:''}`; }
function totalBreakdown(byCur){

    .map(([cur,b])=>cur==='LKR'?fmt(b.total,'LKR'):`${fmt(b.total,cur)} (≈ ${fmtLKR(b.total*rate(cur))})`).join(' + ');
}
function curSplit(byCur){ return Object.entries(byCur).map(([cur,b])=>`<div><b>${cur}</b> · paid ${fmt(b.paid,cur)} of ${fmt(b.total,cur)} · <span class="${b.bal>0?'':'muted'}">due ${fmt(b.bal,cur)}</span></div>`).join(''); }
const hasInvoice = it => !!(it.invoiceNo || it.invoiceDate || (it.invoiceFiles||[]).length);

/* ================= SAVINGS ================= */
function chitCalc(b){
  const cur=b.currency||'LKR', r=rate(cur), now=ymNow(), tx=b.txns||[];
  const n=+b.members||0, amt=+b.monthly||0, start=(b.startDate||today()).slice(0,7), end=ymAdd(start,Math.max(0,n-1));
  const total=n*amt, payoutAmt=+b.payoutAmount||total, payoutYm=b.payoutMonth||'';
  const dep=sum(tx.filter(x=>x.type==='deposit'),x=>+x.amount);
  const payouts=tx.filter(x=>x.type==='payout'), received=sum(payouts,x=>+x.amount);
  const receivedDate=payouts.map(x=>x.date).sort().pop()||null;
  const months=ymRange(start,end).slice(0,n).map((m,i)=>{
    const due=monthDay(m,b.day||1), deposited=sum(tx.filter(x=>x.type==='deposit'&&x.date.slice(0,7)===m),x=>+x.amount);
    return {no:i+1,ym:m,due,planned:amt,deposited,diff:deposited-amt,short:Math.max(0,amt-deposited),status:dateStatus(deposited>=amt-0.005,deposited>0,due),payout:m===payoutYm};
  });
  const cm=months.find(x=>x.ym===now)||null, missed=months.filter(x=>x.status==='overdue');
  const payoutStatus = received>=payoutAmt-0.005 ? 'paid' : !payoutYm ? 'upcoming' : payoutYm<now ? 'overdue' : payoutYm===now ? 'due-soon' : 'upcoming';
  const position=dep-received;                       // + = group holds your money, − = you still owe the group
  const remainingToPay=Math.max(0,total-dep);
  const needNow = cm && cm.status!=='paid' ? cm.short : 0;
  const payoutDue = payoutStatus!=='paid' && payoutYm && payoutYm<=now ? Math.max(0,payoutAmt-received) : 0;
  return {chit:true,cur,r,members:n,monthly:amt,total,payoutAmt,payoutYm,payoutNo:months.findIndex(x=>x.payout)+1,received,receivedDate,payoutStatus,
    dep,wd:0,intr:0,position,remainingToPay,start,end,months,cm,missed,paidN:months.filter(x=>x.status==='paid').length,
    monthNo:cm?cm.no:(now<start?0:n),
    balance:position, balanceLKR:position*r, savedLKR:Math.max(0,position)*r, oweLKR:Math.max(0,-position)*r,
    target:0,targetLKR:0,remaining:remainingToPay,pct:total?Math.round(dep/total*100):0,
    needNow,needNowLKR:needNow*r,missedAmt:sum(missed,x=>x.short),payoutDue,payoutDueLKR:payoutDue*r,finish:null,required:null};
}
function savCalc(b){
  if(isChit(b)) return chitCalc(b);
  const cur=b.currency||'LKR', r=rate(cur), t=today(), now=t.slice(0,7), tx=b.txns||[];
  const dep=sum(tx.filter(x=>x.type==='deposit'),x=>+x.amount);
  const wd=sum(tx.filter(x=>x.type==='withdrawal'),x=>+x.amount);
  const intr=sum(tx.filter(x=>x.type==='interest'),x=>+x.amount);
  const balance=dep+intr-wd, target=+b.target||0, remaining=Math.max(0,target-balance);
  const pct=target?Math.min(100,Math.round(balance/target*100)):0;
  const monthly=+b.monthly||0, start=(b.startDate||today()).slice(0,7);
  const end=b.targetDate ? b.targetDate.slice(0,7) : [ymAdd(now,2),ymAdd(start,11)].sort().pop();
  const months=[];
  if(monthly>0) for(const m of ymRange(start,end)){
    const due=monthDay(m,b.day||1);
    const deposited=sum(tx.filter(x=>x.type==='deposit'&&x.date.slice(0,7)===m),x=>+x.amount);
    const withdrawn=sum(tx.filter(x=>x.type==='withdrawal'&&x.date.slice(0,7)===m),x=>+x.amount), earned=sum(tx.filter(x=>x.type==='interest'&&x.date.slice(0,7)===m),x=>+x.amount);
    const done=deposited>=monthly-0.005;
    const status=(target && balance>=target && !done && m>=now) ? 'waived' : (done ? 'paid' : deposited>0 ? 'partial' : dateStatus(false,false,due));
    months.push({ym:m,due,planned:monthly,deposited,withdrawn,earned,net:deposited+earned-withdrawn,diff:deposited-monthly,status,short:Math.max(0,monthly-deposited)});
  }
  const cm=months.find(x=>x.ym===now)||null;
  const missed=months.filter(x=>x.status==='overdue');
  let monthsLeft=null, required=null;
  if(b.targetDate && remaining>0){ monthsLeft=Math.max(1,ymRange(now,b.targetDate.slice(0,7)).length); required=remaining/monthsLeft; }
  const elapsed=Math.max(1,ymRange(start,now<start?start:now).length);
  const avgWd=wd/elapsed, avgInt=intr/elapsed, netMonthly=monthly-avgWd+avgInt;
  const finish = target && remaining<=0 ? 'reached' : (target && netMonthly>0 ? monthDay(ymAdd(now,Math.ceil(remaining/netMonthly)-1),b.day||1) : null);
  const eoyMonths=ymRange(ymAdd(now,1),now.slice(0,4)+'-12').length;
  const proj12=balance+12*netMonthly, projEoy=balance+eoyMonths*netMonthly;
  const needNow = cm && (cm.status!=='paid'&&cm.status!=='waived') ? cm.short : 0;
  return {cur,r,dep,wd,intr,balance,target,remaining,pct,monthly,months,cm,missed,monthsLeft,required,finish,
    avgWd,avgInt,netMonthly,proj12,projEoy,eoyMonths,balanceLKR:balance*r, targetLKR:target*r, needNow, needNowLKR:needNow*r, missedAmt:sum(missed,x=>x.short)};
}

/* ================= CREDIT CARD / LOAN ================= */
const DEBT_MODES={fixed:'Fixed amount','fixed+min':'Amount + minimum',min:'Minimum only',full:'Full statement balance'};
function planLabel(mode,amt,b){ const a=fmt(+amt||0,b.currency||'QAR'); return mode==='min'?'Minimum only':mode==='full'?'Full statement balance':mode==='fixed+min'?`${a} + minimum (${b.minPct??3}%)`:`${a} a month`; }
function planPay(mode,amt,stmtBal,min){ return Math.min(stmtBal, mode==='min'?min : mode==='full'?stmtBal : mode==='fixed+min'?(+amt||0)+min : (+amt||0)); }
/* month-by-month projection exactly like the repayment plan: fees on the balance at each statement, then your payment */
function debtProject(b,startBal,firstStmt,mode,amt,spend){
  const iP=(+b.interestPct||0)/100, sP=(+b.insurancePct||0)/100, mP=(+(b.minPct??3))/100, dDay=+b.dueDay||4, sDay=+b.statementDay||19;
  const rows=[]; let B=startBal, date=firstStmt, totI=0, totS=0, totPay=0;
  while(B>0.005 && rows.length<120){
    const int=B*iP, ins=B*sP, stmtBal=B+int+ins+(+spend||0), min=stmtBal*mP, pay=planPay(mode,amt,stmtBal,min);
    if(pay<=0) break;
    const open=B; B=Math.max(0,stmtBal-pay); totI+=int; totS+=ins; totPay+=pay;
    rows.push({stmt:date,open,int,ins,fees:int+ins,spend:+spend||0,stmtBal,min,pay,due:monthDay(ymAdd(date.slice(0,7),1),dDay),rest:B});
    date=monthDay(ymAdd(date.slice(0,7),1),sDay);
  }
  return {rows,int:totI,ins:totS,fees:totI+totS,paid:totPay,months:rows.length,never:B>0.005,end:rows.length?rows[rows.length-1].due:null};
}
function debtCalc(b){
  const cur=b.currency||'QAR', r=rate(cur), t=today();
  const st=[...(b.statements||[])].sort((a,c)=>a.date.localeCompare(c.date)), tx=[...(b.txns||[])].sort((a,c)=>a.date.localeCompare(c.date));
  const last=st[st.length-1]||null, anchor=last?last.date:(b.startDate||'0000-00-00'), anchorBal=last?+last.closing:(+b.startBalance||0);
  const after=tx.filter(x=>x.date>anchor);
  const balance=Math.max(0,anchorBal-sum(after.filter(x=>x.type==='payment'),x=>+x.amount)+sum(after.filter(x=>x.type!=='payment'),x=>+x.amount));
  const dDay=+b.dueDay||4, sDay=+b.statementDay||19, mP=+(b.minPct??3);
  let due=null, minDue=0, planned=0, paidCycle=0, status='none';
  if(last){
    due=last.dueDate||monthDay(ymAdd(last.date.slice(0,7),1),dDay);
    minDue=(last.minDue!=null&&last.minDue!=='')?+last.minDue:Math.round(last.closing*mP)/100;
    planned=planPay(b.planMode||'fixed+min',b.planAmount,+last.closing,minDue);
    paidCycle=sum(after.filter(x=>x.type==='payment'),x=>+x.amount);
    status = paidCycle>=planned-0.005||balance<=0.005 ? 'paid' : due<t ? (paidCycle>=minDue-0.005?'partial':'overdue') : paidCycle>0 ? 'partial' : dateStatus(false,false,due);
  }
  const remainingCycle=status==='paid'?0:Math.max(0,planned-paidCycle);
  const minLeft=Math.max(0,minDue-paidCycle);
  let next=monthDay(ymNow(),sDay); if(next<=t) next=monthDay(ymAdd(ymNow(),1),sDay); if(last&&next<=last.date) next=monthDay(ymAdd(last.date.slice(0,7),1),sDay);
  // this cycle's planned payment counts first, then the projection continues from what is left
  const startBal=Math.max(0,balance-remainingCycle);
  const proj=debtProject(b,startBal,next,b.planMode||'fixed+min',b.planAmount,b.monthlySpend);
  if(remainingCycle>0) proj.rows.unshift({current:true,stmt:last.date,open:balance,int:0,ins:0,fees:0,spend:0,stmtBal:balance,min:minLeft,pay:remainingCycle,due,rest:startBal});
  if(remainingCycle>0){ proj.months++; proj.paid+=remainingCycle; if(!proj.end) proj.end=due; }
  const peak=Math.max(+b.startBalance||0,...st.map(s=>Math.max(+s.opening||0,+s.closing||0)),balance);
  const intPaid=sum(st,s=>+s.interest), insPaid=sum(st,s=>+s.insurance), othPaid=sum(st,s=>+s.other||0);
  return {cur,r,st,tx,last,balance,balanceLKR:balance*r,limit:+b.limit||0,util:b.limit?Math.round(balance/b.limit*100):0,
    due,minDue,minLeft,planned,paidCycle,remainingCycle,status,next,proj,peak,paidDown:Math.max(0,peak-balance),pct:peak?Math.round((peak-balance)/peak*100):0,
    intPaid,insPaid,othPaid,feesPaid:intPaid+insPaid+othPaid,monthlyRate:(+b.interestPct||0)+(+b.insurancePct||0),
    totalPaid:sum(tx.filter(x=>x.type==='payment'),x=>+x.amount), unbilled:sum(after.filter(x=>x.type!=='payment'),x=>+x.amount)};
}

/* ================= EXPENSES ================= */
/* balance brought into month m from earlier months (positive = still owed, negative = credit) */
function lineCarryIn(b,l,m){
  const start=l.startMonth||m; if(start>=m) return 0;
  let bal=0; for(const x of ymRange(start,ymAdd(m,-1))){ if(!lineActive(l,x)) continue;
    bal+=(+(l.overrides?.[x]??l.budget)||0)-sum((b.txns||[]).filter(t=>t.lineId===l.id&&t.date.slice(0,7)===x),t=>+t.amount); }
  return Math.round(bal*100)/100;
}
const lineActive = (l,m) => (!l.startMonth||l.startMonth<=m) && (!l.endMonth||m<=l.endMonth);
function expCalc(b,m){
  const cur=b.currency||'LKR', r=rate(cur);
  const lines=(b.lines||[]).filter(l=>lineActive(l,m));
  const tx=(b.txns||[]).filter(x=>x.date.slice(0,7)===m);
  const ids=new Set(lines.map(l=>l.id));
  const rows=lines.map(l=>{
    const spent=sum(tx.filter(x=>x.lineId===l.id),x=>+x.amount), budget=+(l.overrides?.[m] ?? l.budget)||0;
    if(l.isBill){ const due=monthDay(m,l.dueDay);
      if(l.carry){ const carryIn=lineCarryIn(b,l,m), owe=budget+carryIn-spent;
        const status = owe<=0.005 || (spent>0 && owe<1) ? 'paid' : (m<ymNow() ? 'carried' : dateStatus(false,spent>0,due));   // a few cents left simply roll into the next bill
        return {l,spent,budget,carryIn,remaining:owe,due,status}; }
      return {l,spent,budget,remaining:budget-spent,due,status:dateStatus(budget>0?spent>=budget-0.005:spent>0,spent>0,due)}; }
    if(l.daily && !budget) return {l,spent,budget,remaining:0,status:spent>0?'tracked':'unused'};
    return {l,spent,budget,remaining:budget-spent,status:spent>budget+0.005?'over':spent>0?'ok':'unused'};
  });
  const unplanned=sum(tx.filter(x=>!ids.has(x.lineId)),x=>+x.amount);
  const budget=sum(rows,x=>x.budget), spent=sum(rows,x=>x.spent)+unplanned;
  const bills=rows.filter(x=>x.l.isBill);
  return {cur,r,m,rows,tx,unplanned,budget,spent,remaining:budget-spent,pct:budget?Math.round(spent/budget*100):0,
    need:sum(rows,x=>Math.max(0,x.remaining)),
    bills,billsPaid:bills.filter(x=>x.status==='paid').length,billsPendingAmt:sum(bills.filter(x=>x.status!=='paid'),x=>Math.max(0,x.remaining)),
    billsOverdue:bills.filter(x=>x.status==='overdue'),over:rows.filter(x=>x.status==='over'),income:+b.income||0};
}

  if(b.type==='saving'){ const k=savCalc(b); return {pct:k.pct,alerts:k.missed.length+(k.chit&&k.payoutStatus==='overdue'?1:0)}; }

  const k=expCalc(b,ymNow()); return {pct:k.pct,alerts:k.billsOverdue.length,over:k.pct>100};
}

      out.push({date:mo.due,b,title:k.chit?`Seettu contribution — month ${mo.no}/${k.members}`:`Saving — ${ymLabel(mo.ym)}`,amt:fmt(mo.short,k.cur),lkr:k.cur!=='LKR'?mo.short*k.r:null,st:badge(mo.status,'saving'),
        btn:`<button class="btn sm ok" data-act="sav-txn" data-b="${b.id}" data-type="deposit" data-amount="${mo.short}" data-ym="${mo.ym}">${k.chit?'Pay':'Deposit'}</button>`});

      btn:`<button class="btn sm" data-act="sav-txn" data-b="${b.id}" data-type="payout" data-amount="${k.payoutAmt-k.received}">Received</button>`}); }
  for(const b of booksOf('expense')) for(const m of [ymAdd(ymNow(),-1),ymNow(),ymAdd(ymNow(),1)]){ const k=expCalc(b,m);
    for(const row of k.bills) if(row.status!=='paid' && row.due<=lim && (row.status==='overdue'||row.due>=t))
      out.push({date:row.due,b,title:`${row.l.name} bill`,amt:fmt(Math.max(0,row.remaining),k.cur),lkr:null,st:badge(row.status,'bill'),
        btn:`<button class="btn sm ok" data-act="exp-txn" data-b="${b.id}" data-l="${row.l.id}" data-amount="${Math.max(0,row.remaining)}" data-ym="${m}">Pay</button>`}); }
  for(const b of booksOf('debt')){ const k=debtCalc(b);
    if(k.due && k.remainingCycle>0 && k.due<=lim) out.push({date:k.due,b,title:`${b.name} payment`,amt:fmt(k.remainingCycle,k.cur),lkr:k.cur!=='LKR'?k.remainingCycle*k.r:null,st:badge(k.status,'debt'),
      btn:`<button class="btn sm ok" data-act="debt-txn" data-b="${b.id}" data-type="payment" data-amount="${k.remainingCycle}">Pay</button>`}); }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

function sectionNeed(s,now){
  if(s.kind==='course') return allCourseCalc(s.id).monthLKR;
  if(s.kind==='saving') return sum(booksIn(s.id),b=>savCalc(b).needNowLKR);
  if(s.kind==='debt') return sum(booksIn(s.id),b=>{ const k=debtCalc(b); return k.due&&k.due<=monthDay(now,31)?k.remainingCycle*k.r:0; });
  return sum(booksIn(s.id),b=>{ const k=expCalc(b,now); return k.need*k.r; });
}
const NEED_WORD = {course:'due',saving:'to put aside',expense:'still to spend',debt:'to pay'};

function recentActivity(){
  const out=[];
  for(const c of booksOf('course')) for(const it of c.items) for(const p of it.payments) out.push({date:p.date,b:c,title:it.title,amt:fmt(p.amount,it.currency),sign:'',files:p.files});
  for(const b of booksOf('saving')) for(const x of b.txns) out.push({date:x.date,b,title:`${txnLabel(b,x.type)}${isChit(b)?' (Seettu)':''}`,amt:fmt(x.amount,b.currency||'LKR'),sign:x.type==='withdrawal'?'neg':'pos',files:x.files});
  for(const b of booksOf('debt')) for(const x of b.txns) out.push({date:x.date,b,title:TXN_LABEL[x.type],amt:fmt(x.amount,b.currency||'QAR'),sign:x.type==='payment'?'pos':'neg',files:x.files});
  for(const b of booksOf('expense')) for(const x of b.txns){ const l=b.lines.find(l=>l.id===x.lineId); out.push({date:x.date,b,title:l?l.name:'Unplanned expense',amt:fmt(x.amount,b.currency||'LKR'),sign:'',files:x.files}); }
  out.sort((a,b)=>b.date.localeCompare(a.date));
  return out.slice(0,10).map(a=>`<div class="list-row"><div class="grow"><b>${esc(a.title)}</b><div class="sub">${secOf(a.b).icon} ${esc(a.b.name)} · ${fmtDate(a.date)}</div></div>
    <div>${(a.files||[]).map(fileChip).join('')}</div><div class="num ${a.sign}"><b>${a.amt}</b></div></div>`).join('') || '<div class="empty">No activity yet</div>';
}

function flowChart(){
  const now=ymNow(), months=ymRange(ymAdd(now,-5),ymAdd(now,6));
  const z=()=>({course:0,saving:0,expense:0}), P={}, A={};
  months.forEach(m=>{P[m]=z();A[m]=z();});
  for(const c of booksOf('course')) for(const it of c.items){
    const k=calc(it), m=(it.dueDate||'').slice(0,7); if(P[m]) P[m].course+=k.totalLKR;
    for(const p of it.payments){ const pm=p.date.slice(0,7); if(A[pm]) A[pm].course+=p.amount*(it.currency==='LKR'?1:(+p.rate||rate(it.currency))); }
  }
  for(const b of booksOf('saving')){ const k=savCalc(b);
    k.months.forEach(x=>{ if(P[x.ym]&&x.status!=='waived') P[x.ym].saving+=x.planned*k.r; });
    b.txns.filter(x=>x.type==='deposit').forEach(x=>{ const m=x.date.slice(0,7); if(A[m]) A[m].saving+=x.amount*k.r; });
  }
  for(const b of booksOf('expense')) months.forEach(m=>{ const k=expCalc(b,m); P[m].expense+=k.budget*k.r; A[m].expense+=k.spent*k.r; });
  const tot=o=>o.course+o.saving+o.expense;
  const max=Math.max(1,...months.map(m=>Math.max(tot(P[m]),tot(A[m]))));
  const W=640, H=250, pl=52, pb=30, pt=10, cw=(W-pl-8)/months.length, bw=Math.min(16,cw/2.6);
  const y=v=>pt+(H-pt-pb)*(1-v/max), h=v=>(H-pt-pb)*v/max;
  const sc=(DASH.active&&DASH.cur!=='ALL'&&DASH.cur!=='LKR')?1/rate(DASH.cur):1;
  const short=v=>(v*=sc)>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'k':Math.round(v);
  const SER=[['course','var(--c-course)','Payments'],['saving','var(--c-sav)','Savings'],['expense','var(--c-exp)','Expenses']];
  let s=`<div class="legend">${SER.map(([,c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}<span>Left bar = planned (faded) · right bar = actual</span></div>
  <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Planned vs actual money out per month">`;
  [0,.25,.5,.75,1].forEach(f=>{ const v=f*max; s+=`<line x1="${pl}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${short(v)}</text>`; });
  months.forEach((m,i)=>{
    const x=pl+i*cw+cw/2;
    if(m===now) s+=`<rect x="${pl+i*cw}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="var(--accent-weak)" opacity=".6"/>`;
    [[P[m],x-bw-1,.38,'planned'],[A[m],x+1,1,'actual']].forEach(([o,bx,op,lab])=>{
      let base=H-pb;
      SER.forEach(([key,col,l])=>{ const hh=h(o[key]); if(hh<=0) return; base-=hh;
        s+=`<rect x="${bx}" y="${base}" width="${bw}" height="${hh}" fill="${col}" opacity="${op}"><title>${ymLabel(m)} — ${lab} ${l}: ${fmtLKR(o[key])} (total ${fmtLKR(tot(o))})</title></rect>`; });
    });
    s+=`<text x="${x}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="${m===now?'var(--accent)':'var(--muted)'}" ${m===now?'font-weight="700"':''}>${ymShort(m)}</text>`;
  });
  return s+`</svg></div>`;
}

function courseSchedule(c){
  const f=V.filter;
  let items=sortItems(c.items).map(it=>({it,k:calc(it)}));
  const idx=new Map(items.map((x,i)=>[x.it.id,i+1]));
  if(f.status) items=items.filter(x=> f.status==='unpaid' ? x.k.remaining>0 : x.k.status===f.status);
  if(f.cat) items=items.filter(x=>x.it.category===f.cat);
  if(f.q){ const q=f.q.toLowerCase(); items=items.filter(x=>(x.it.title+' '+x.it.notes+' '+(x.it.invoiceNo||'')+' '+x.it.payments.map(p=>p.ref+' '+p.note).join(' ')).toLowerCase().includes(q)); }
  const statusOpts=[['','All statuses'],['unpaid','All unpaid'],...Object.entries(LABELS.course)];
  return `
  <div class="toolbar">
    <input type="search" placeholder="Search…" value="${esc(f.q)}" data-filter="q" style="width:180px">
    <select data-filter="status">${statusOpts.map(([v,l])=>`<option value="${v}" ${f.status===v?'selected':''}>${l}</option>`).join('')}</select>
    <select data-filter="cat"><option value="">All categories</option>${catsFor(c).map(x=>`<option ${f.cat===x?'selected':''}>${x}</option>`).join('')}</select>
    <span class="sp"></span>
    <button class="btn primary" data-act="item-modal" data-b="${c.id}">➕ Add item</button>
    <button class="btn" data-act="gen-modal" data-b="${c.id}">🧮 Generate installments</button>
    <button class="btn" data-act="resched-modal" data-b="${c.id}">📆 Reschedule</button>
    <button class="btn" data-act="csv-course" data-b="${c.id}">⬇ CSV</button>
    <button class="btn" onclick="print()">🖨 Print</button>
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>Item</th><th>Due date</th><th class="num">Amount</th><th class="num">Paid</th><th class="num">Balance</th><th>Status</th><th class="no-print"></th></tr></thead>
    <tbody>
    ${items.map(({it,k})=>{
      const open=V.open.has(it.id), nFiles=sum(it.payments,p=>(p.files||[]).length), hasInv=hasInvoice(it);
      return `<tr class="row ${open?'open':''}" data-act="toggle" data-i="${it.id}">
        <td class="muted">${idx.get(it.id)}</td>
        <td><b>${esc(it.title)}</b><div class="sub">${esc(it.category)}${it.notes?' · 📝':''}${hasInv?` · 🧾 ${it.invoiceNo?'Inv '+esc(it.invoiceNo):'Invoice'}`:''}</div></td>
        <td class="nowrap">${fmtDate(it.dueDate)}<div class="sub">${k.remaining>0?relDate(it.dueDate):(k.lastPaid?'paid '+fmtDate(k.lastPaid):'')}</div></td>
        <td class="num">${amountCell(it.amount,it.currency,it.amount*rate(it.currency))}</td>
        <td class="num">${k.paid?amountCell(k.paid,it.currency,k.paidLKR):'<span class="muted">—</span>'}</td>
        <td class="num">${k.remaining?amountCell(k.remaining,it.currency,k.remainingLKR):'<span class="muted">—</span>'}</td>
        <td>${courseBadge(k)}</td>
        <td class="nowrap right no-print">
          ${k.remaining>0?`<button class="btn sm ok" data-act="pay" data-b="${c.id}" data-i="${it.id}">Pay</button>`:''}
          <button class="icon-btn" title="${hasInv?'View / edit invoice':'Add invoice'}" data-act="inv-modal" data-b="${c.id}" data-i="${it.id}" style="${hasInv?'':'opacity:.45'}">🧾</button>
          ${nFiles?`<span class="sub" title="Receipts">📎${nFiles}</span>`:''}
          <button class="icon-btn" title="Edit" data-act="item-modal" data-b="${c.id}" data-i="${it.id}">✏️</button>
          <button class="icon-btn" title="Delete" data-act="del-item" data-b="${c.id}" data-i="${it.id}">🗑</button>
        </td></tr>
        ${open?`<tr class="detail"><td colspan="8">${itemDetail(c,it,k)}</td></tr>`:''}`;

    </tbody>
    <tfoot><tr><td></td><td colspan="2"><b>Total (shown items, LKR equiv.)</b></td>
      <td class="num"><b>${fmtLKR(sum(items,x=>x.k.totalLKR))}</b></td><td class="num"><b>${fmtLKR(sum(items,x=>x.k.paidLKR))}</b></td><td class="num"><b>${fmtLKR(sum(items,x=>x.k.remainingLKR))}</b></td><td colspan="2"></td></tr></tfoot>
  </table></div>
  <div class="hint">Tip: click a row to see its invoice, payments and receipts.</div>`;
}
function itemDetail(c,it,k){
  return `<div class="row-flex" style="margin-bottom:10px"><b>Payments for ${esc(it.title)}</b>
    <span>${k.remaining>0?`<button class="btn sm ok" data-act="pay" data-b="${c.id}" data-i="${it.id}">➕ Record payment</button>`:''}
    ${it.payments.length?`<button class="btn sm danger" data-act="unpay" data-b="${c.id}" data-i="${it.id}">↺ Mark unpaid</button>`:''}</span></div>
  ${it.notes?`<div class="notes" style="margin-bottom:10px">${esc(it.notes)}</div>`:''}
  <div class="pay" style="margin-bottom:8px">
    <div><b>🧾 Invoice</b><div class="sub">${it.invoiceDate?fmtDate(it.invoiceDate):''}</div></div>
    <div>${hasInvoice(it)?`${it.invoiceNo?`<b>No. ${esc(it.invoiceNo)}</b>`:''}${it.invoiceAmount?` <span class="sub">· ${fmt(it.invoiceAmount,it.currency)}</span>`:''}${it.invoiceNote?`<div class="sub">${esc(it.invoiceNote)}</div>`:''}
      <div>${(it.invoiceFiles||[]).map(fileChip).join('')||'<span class="sub">No invoice file uploaded</span>'}</div>`:'<span class="sub">No invoice recorded yet</span>'}</div>
    <div class="nowrap"><button class="btn sm" data-act="inv-modal" data-b="${c.id}" data-i="${it.id}">${hasInvoice(it)?'✏️ Edit':'➕ Add invoice'}</button></div></div>
  <div class="pay-list">${it.payments.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<div class="pay"><div><b>${fmtDate(p.date)}</b><div class="sub">${esc(p.method||'')}</div></div>
    <div><b>${fmt(p.amount,it.currency)}</b>${it.currency!=='LKR'?` <span class="sub">@ Rs ${p.rate} = ${fmtLKR(p.amount*p.rate)}</span>`:''}
      ${p.ref?`<div class="sub">Ref: ${esc(p.ref)}</div>`:''}${p.note?`<div class="sub">${esc(p.note)}</div>`:''}

    <div class="nowrap"><button class="icon-btn" title="Edit payment" data-act="pay" data-b="${c.id}" data-i="${it.id}" data-p="${p.id}">✏️</button>

}
function coursePayments(c){
  const pays=[]; for(const it of c.items) for(const p of it.payments) pays.push({it,p});
  pays.sort((a,b)=>b.p.date.localeCompare(a.p.date));
  return `<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Item</th><th>Method / Ref</th><th class="num">Amount</th><th class="num">LKR</th><th>Receipts</th><th class="no-print"></th></tr></thead><tbody>
  ${pays.map(({it,p})=>`<tr><td class="nowrap">${fmtDate(p.date)}</td><td><b>${esc(it.title)}</b><div class="sub">${esc(it.category)}</div></td>
    <td>${esc(p.method||'')}<div class="sub">${esc(p.ref||'')}</div></td><td class="num">${fmt(p.amount,it.currency)}</td>
    <td class="num">${fmtLKR(p.amount*(it.currency==='LKR'?1:p.rate))}${it.currency!=='LKR'?`<div class="sub">@ ${p.rate}</div>`:''}</td>
    <td>${(p.files||[]).map(fileChip).join('')||'<span class="sub">—</span>'}</td>
    <td class="nowrap no-print"><button class="icon-btn" data-act="pay" data-b="${c.id}" data-i="${it.id}" data-p="${p.id}">✏️</button><button class="icon-btn" data-act="del-pay" data-b="${c.id}" data-i="${it.id}" data-p="${p.id}">🗑</button></td></tr>`).join('')
    ||'<tr><td colspan="7" class="empty">No payments yet</td></tr>'}
  </tbody><tfoot><tr><td colspan="4"><b>Total paid</b></td><td class="num"><b>${fmtLKR(sum(pays,x=>x.p.amount*(x.it.currency==='LKR'?1:x.p.rate)))}</b></td><td colspan="2"></td></tr></tfoot></table></div>`;
}
function courseOverview(c){
  const rows={};
  for(const it of c.items){ const k=calc(it), key=it.category+'|'+it.currency;
    const r=rows[key]||(rows[key]={cat:it.category,cur:it.currency,n:0,total:0,paid:0,bal:0,lkr:0}); r.n++; r.total+=it.waived?k.paid:+it.amount; r.paid+=k.paid; r.bal+=k.remaining; r.lkr+=k.totalLKR; }
  return `<div class="grid two">
    <div class="card"><h2>Fee breakdown</h2><table><thead><tr><th>Category</th><th class="num">Items</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Balance</th></tr></thead><tbody>
    ${Object.values(rows).map(r=>`<tr><td>${esc(r.cat)}</td><td class="num">${r.n}</td><td class="num">${fmt(r.total,r.cur)}${r.cur!=='LKR'?`<div class="sub">≈ ${fmtLKR(r.lkr)}</div>`:''}</td><td class="num">${fmt(r.paid,r.cur)}</td><td class="num">${fmt(r.bal,r.cur)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="card"><div class="row-flex"><h2>Notes</h2><button class="btn sm" data-act="book-modal" data-b="${c.id}" data-type="course">Edit</button></div><div class="notes">${esc(c.notes||'No notes')}</div></div>
  </div>`;
}

/* ================= SAVING PAGE ================= */
function renderSaving(b){
  if(isChit(b)) return renderChit(b);
  const k=savCalc(b), cur=k.cur;
  if(!['plan','txns','docs','overview'].includes(V.tab)) V.tab='plan';
  const body = V.tab==='txns'?savTxns(b,k) : V.tab==='docs'?bookDocs(b) : V.tab==='overview'?savOverview(b,k) : savPlan(b,k);
  return `${bookHeader(b,`${esc(b.institution||'No account set')}${b.startDate?' · Started '+fmtDate(b.startDate):''}${b.targetDate?' · Target date '+fmtDate(b.targetDate):''}${cur!=='LKR'?` · ${cur} (1 ${cur} = Rs ${rate(cur)})`:''}`)}
  ${k.missed.length?`<div class="banner bad">⚠ ${k.missed.length} planned month(s) missed — short by ${fmt(k.missedAmt,cur)}. Record a deposit to catch up.</div>`:''}
  <div class="grid kpis">
    <div class="card kpi ok"><div class="l">Saved balance</div><div class="v">${fmt(k.balance,cur)}</div>${k.target?`<div style="margin-top:8px">${pctBar(k.pct)}</div><div class="s">${k.pct}% of target</div>`:''}${cur!=='LKR'?`<div class="s">≈ ${fmtLKR(k.balanceLKR)}</div>`:''}</div>
    <div class="card kpi"><div class="l">Target</div><div class="v">${k.target?fmt(k.target,cur):'—'}</div><div class="s">${b.targetDate?'by '+fmtDate(b.targetDate):'No target date'}</div></div>
    <div class="card kpi"><div class="l">Still needed</div><div class="v">${fmt(k.remaining,cur)}</div><div class="s">${k.required!=null?`Need ${fmt(Math.ceil(k.required),cur)}/month for ${k.monthsLeft} month(s)`:''}</div></div>
    <div class="card kpi warn"><div class="l">This month (${MON[+ymNow().slice(5)-1]})</div><div class="v">${k.cm?`${fmt(k.cm.deposited,cur)}`:'—'}</div><div class="s">${k.cm?`of ${fmt(k.cm.planned,cur)} planned · due ${fmtDate(k.cm.due)} ${badge(k.cm.status,'saving')}`:'No contribution planned'}</div></div>
    <div class="card kpi"><div class="l">Projection</div>
      <div class="v" style="font-size:17px">${k.finish==='reached'?'🎉 Target reached':k.finish?'Target '+fmtDate(k.finish):k.monthly||k.balance?'≈ '+fmt(Math.round(k.proj12),cur):'—'}</div>
      <div class="s">${k.finish&&k.finish!=='reached'?`saving ≈ ${fmt(Math.round(k.netMonthly),cur)}/month net${b.targetDate?(k.finish<=b.targetDate?' · on track ✅':' · later than target ⚠'):''}<br>`:''}${!k.finish&&(k.monthly||k.balance)?`in 12 months (${ymLabel(ymAdd(ymNow(),12))})<br>`:''}${k.eoyMonths?`by Dec ${ymNow().slice(0,4)}: ≈ ${fmt(Math.round(k.projEoy),cur)}<br>`:''}
        Net per month ≈ ${fmt(Math.round(k.netMonthly),cur)} = plan ${fmt(k.monthly,cur)} − withdrawals${k.avgInt?' + profit':''}</div></div>
    ${(()=>{ const w=b.txns.filter(x=>x.type==='withdrawal').sort((p,q)=>q.date.localeCompare(p.date)), now=ymNow(), thisM=sum(w.filter(x=>x.date.slice(0,7)===now),x=>+x.amount);
      return `<div class="card kpi ${w.length?'bad':''}"><div class="l">Withdrawals</div><div class="v">${w.length?'−'+fmt(k.wd,cur):fmt(0,cur)}</div>
        <div class="s">${w.length?`${w.length} withdrawal(s) · ≈ ${fmt(Math.round(k.avgWd*100)/100,cur)}/month<br>Last: −${fmt(w[0].amount,cur)} on ${fmtDate(w[0].date)}<br>This month: ${thisM?'−'+fmt(thisM,cur):'none'} · <a data-act="tab" data-tab="txns" style="cursor:pointer">see all →</a>`:'None so far 👍'}</div></div>`; })()}
  </div>
  <div class="card" style="margin-top:14px;padding:12px 16px" class="sub"><span class="sub">Deposits ${fmt(k.dep,cur)} · Interest ${fmt(k.intr,cur)} · Withdrawals ${fmt(k.wd,cur)} · Plan ${k.monthly?fmt(k.monthly,cur)+' on day '+(b.day||1)+' each month':'not set'}</span></div>
  ${tabsHtml([['plan','📅 Monthly plan'],['txns','💳 Transactions'],['docs','📁 Documents'],['overview','ℹ️ Overview']])}
  ${body}`;
}
function savToolbar(b){
  if(isChit(b)) return `<div class="toolbar"><span class="sp"></span>
    <button class="btn ok" data-act="sav-txn" data-b="${b.id}" data-type="deposit">➕ Contribution</button>
    <button class="btn" data-act="sav-txn" data-b="${b.id}" data-type="payout" data-amount="${chitCalc(b).payoutDue||''}">💰 Payout received</button>
    <button class="btn" data-act="book-modal" data-b="${b.id}">⚙ Edit Seettu</button>
    <button class="btn" data-act="csv-saving" data-b="${b.id}">⬇ CSV</button></div>`;
  return `<div class="toolbar"><span class="sp"></span>
    <button class="btn ok" data-act="sav-txn" data-b="${b.id}" data-type="deposit">➕ Deposit</button>
    <button class="btn" data-act="sav-txn" data-b="${b.id}" data-type="interest">💹 Interest / profit</button>
    <button class="btn danger" data-act="sav-txn" data-b="${b.id}" data-type="withdrawal">➖ Withdrawal</button>
    <button class="btn" data-act="book-modal" data-b="${b.id}" data-type="saving">⚙ Edit plan</button>
    <button class="btn" data-act="csv-saving" data-b="${b.id}">⬇ CSV</button></div>`;
}
function savPlan(b,k){
  if(!k.monthly) return `${savToolbar(b)}<div class="card empty">No monthly contribution set. Click <b>Edit plan</b> to set a monthly amount and day — the schedule will appear here.</div>`;
  return `${savToolbar(b)}<div class="tbl-wrap"><table><thead><tr><th>Month</th><th>Due date</th><th class="num">Planned</th><th class="num">Deposited</th><th class="num">Withdrawn</th><th class="num">Net saved</th><th class="num">vs plan</th><th>Status</th><th class="no-print"></th></tr></thead><tbody>
    ${k.months.map(mo=>`<tr${mo.ym===ymNow()?' style="background:var(--accent-weak)"':''}><td><b>${ymLabel(mo.ym)}</b></td><td class="nowrap">${fmtDate(mo.due)}<div class="sub">${mo.status==='paid'||mo.status==='waived'?'':relDate(mo.due)}</div></td>
      <td class="num">${fmt(mo.planned,k.cur)}</td><td class="num">${mo.deposited?fmt(mo.deposited,k.cur):'<span class="muted">—</span>'}</td><td class="num ${mo.withdrawn?'neg':''}">${mo.withdrawn?'−'+fmt(mo.withdrawn,k.cur):'<span class="muted">—</span>'}</td><td class="num"><b>${mo.deposited||mo.withdrawn||mo.earned?fmt(mo.net,k.cur):'<span class="muted">—</span>'}</b>${mo.earned?`<div class="sub">incl. +${fmt(mo.earned,k.cur)} profit</div>`:''}</td>
      <td class="num ${mo.diff>=0?'pos':(mo.status==='overdue'?'neg':'muted')}">${mo.deposited||mo.status==='overdue'?(mo.diff>=0?'+':'')+fmt(mo.diff,k.cur):''}</td>
      <td>${badge(mo.status,'saving')}</td>
      <td class="no-print right">${['paid','waived'].includes(mo.status)?'':`<button class="btn sm ok" data-act="sav-txn" data-b="${b.id}" data-type="deposit" data-amount="${mo.short}" data-ym="${mo.ym}">Deposit</button>`}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="2"><b>Total</b></td><td class="num"><b>${fmt(sum(k.months,x=>x.planned),k.cur)}</b></td><td class="num"><b>${fmt(sum(k.months,x=>x.deposited),k.cur)}</b></td><td class="num neg"><b>${sum(k.months,x=>x.withdrawn)?'−'+fmt(sum(k.months,x=>x.withdrawn),k.cur):'—'}</b></td><td class="num"><b>${fmt(sum(k.months,x=>x.net),k.cur)}</b></td><td colspan="3"></td></tr></tfoot></table></div>
    <div class="hint">A month is <b>Saved</b> when its deposits reach the plan, <b>Partly saved</b> when something was deposited but less than the plan, and <b>Missed</b> only when nothing was deposited. <b>Net saved</b> = deposits + profit − withdrawals in that month.</div>`;
}
function savTxns(b,k){
  const asc=[...b.txns].sort((x,y)=>x.date.localeCompare(y.date)); let run=0; const bal={};
  const out=x=>x.type==='withdrawal'||x.type==='payout';
  for(const x of asc){ run+=out(x)?-x.amount:+x.amount; bal[x.id]=run; }
  const list=[...asc].reverse();
  return `${savToolbar(b)}<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Type</th><th class="num">Amount</th><th class="num">${isChit(b)?'Position after':'Balance after'}</th><th>Method / Ref</th><th>Note</th><th>Files</th><th class="no-print"></th></tr></thead><tbody>
    ${list.map(x=>`<tr><td class="nowrap">${fmtDate(x.date)}</td><td><span class="badge b-${x.type}">${txnLabel(b,x.type)}</span></td>

function debtStmtModal(bid,sid){
  const b=book(bid), s=sid?b.statements.find(x=>x.id===sid):null, cur=b.currency||'QAR';
  const prev=[...b.statements].filter(x=>x!==s).sort((a,c)=>a.date.localeCompare(c.date)).filter(x=>!s||x.date<s.date).pop();
  const defDate=s?.date||(()=>{ let d=monthDay(ymNow(),+b.statementDay||19); if(d>today()) d=monthDay(ymAdd(ymNow(),-1),+b.statementDay||19); return d; })();
  const opening=s?.opening??(prev?+prev.closing:(+b.startBalance||0));
  const win=x=>x.date>(prev?prev.date:'0000')&&x.date<=defDate;
  const paid=s?.paid??Math.round(sum(b.txns.filter(x=>x.type==='payment'&&win(x)),x=>+x.amount)*100)/100;
  const spend=s?.spend??Math.round(sum(b.txns.filter(x=>x.type!=='payment'&&win(x)),x=>+x.amount)*100)/100;
  const est=v=>Math.round(opening*v)/100;
  modal({onDelete:s?()=>A['del-stmt']({b:b.id,s:s.id}):null,title:`${s?'Edit':'Add'} statement — ${esc(b.name)}`,body:`<div class="form">
    <div><label>Statement date</label><input type="date" name="date" value="${defDate}"></div>

    <div><label>Interest charged</label><input type="number" step="0.01" min="0" name="interest" value="${s?.interest??est(+b.interestPct||0)}"></div>
    <div><label>Insurance (Credit Shield)</label><input type="number" step="0.01" min="0" name="insurance" value="${s?.insurance??est(+b.insurancePct||0)}"></div>
    <div><label>Other fees (late, cash advance, transfer…)</label><input type="number" step="0.01" min="0" name="other" value="${s?.other??0}"></div>
    <div><label>Closing balance (from statement)</label><input type="number" step="0.01" name="closing" value="${s?.closing??''}"></div>
    <div><label>Minimum due</label><input type="number" step="0.01" min="0" name="minDue" value="${s?.minDue??''}"></div>
    <div><label>Payment due date</label><input type="date" name="dueDate" value="${s?.dueDate||''}"></div>
    <div><label>Note</label><input type="text" name="note" value="${esc(s?.note||'')}"></div>
    <div class="full calc-box" id="st-check"></div>
    ${filesField(s?.files,'Statement PDF')}
  </div>`,
  onOpen(f){
    wireFiles(f);
    const u=()=>{ const g=n=>+f.elements[n].value||0, calc=g('opening')-g('paid')+g('spend')+g('interest')+g('insurance')+g('other');
      if(!f.elements.closing.dataset.touched) f.elements.closing.value=calc.toFixed(2);
      if(!f.elements.minDue.dataset.touched) f.elements.minDue.value=(g('closing')*(+(b.minPct??3))/100).toFixed(2);
      if(!f.elements.dueDate.dataset.touched&&f.elements.date.value) f.elements.dueDate.value=monthDay(ymAdd(f.elements.date.value.slice(0,7),1),+b.dueDay||4);
      const diff=g('closing')-calc; f.querySelector('#st-check').innerHTML=Math.abs(diff)<0.02?'✅ Opening − paid + spending + fees = closing':`⚠ Difference of ${fmt(diff,cur)} — check the figures (or there are other charges/refunds)`; };
    ['closing','minDue','dueDate'].forEach(n=>f.elements[n].addEventListener('input',()=>f.elements[n].dataset.touched=1));
    if(s) ['closing','minDue','dueDate'].forEach(n=>f.elements[n].dataset.touched=1);
    f.addEventListener('input',u); u();
  },
  async onSubmit(f){
    const g=n=>+val(f,n)||0, d={date:val(f,'date'),opening:g('opening'),paid:g('paid'),spend:g('spend'),interest:g('interest'),insurance:g('insurance'),other:g('other'),closing:g('closing'),minDue:val(f,'minDue')===''?null:g('minDue'),dueDate:val(f,'dueDate'),note:val(f,'note')};
    if(!d.date){ toast('Enter the statement date'); return false; }
    const x=s||{id:uid(),files:[]}; Object.assign(x,d);
    x.files=await applyFiles(f,x.files,{bookId:b.id,stmtId:x.id,docType:'Bank Statement',title:`Statement ${fmtDate(d.date)}`,note:b.name});
    if(!s) b.statements.push(x);
    await save(); toast('Statement saved');
  }});
}

function lineHistoryModal(bid,lid){

/* ---------- day-by-day tracking for lines marked "Track day by day" (food, travel…) ---------- */
const dailyLines = b => (b.lines||[]).filter(l=>l.daily);

function expDaily(b,k){
  const cur=k.cur, m=k.m, all=dailyLines(b), lines=all.filter(l=>lineActive(l,m)), t=today();
  if(!all.length) return `<div class="card empty">No budget lines are tracked day by day yet.<br>Edit a line (✏️ on the Budget tab) and tick <b>Track day by day</b> — e.g. Food, Travel, Coffee.</div>`;
  if(!lines.length) return `<div class="card empty">Day-by-day tracking (${all.map(l=>esc(l.name)).join(', ')}) starts in ${ymLabel(all.map(l=>l.startMonth||m).sort()[0])}. Use ◀ ▶ at the top to change month.</div>`;
  const dim=+monthDay(m,31).slice(8), isNow=m===ymNow(), past=m<ymNow(), lastDay=isNow?+t.slice(8):past?dim:0, td=+t.slice(8);
  const ids=new Set(lines.map(l=>l.id)), tx=k.tx.filter(x=>ids.has(x.lineId)).sort((a,c)=>a.date.localeCompare(c.date));
  const byDay=new Map(); for(const x of tx){ const d=+x.date.slice(8); if(!byDay.has(d)) byDay.set(d,[]); byDay.get(d).push(x); }
  const dayAmt=(d,lid)=>sum((byDay.get(d)||[]).filter(x=>!lid||x.lineId===lid),x=>+x.amount);
  const spent=sum(tx,x=>+x.amount), budOf=l=>+(l.overrides?.[m]??l.budget)||0, budget=sum(lines,budOf);
  const avg=lastDay?spent/lastDay:0, proj=isNow?avg*dim:spent, daysLeft=isNow?dim-td+1:past?0:dim;
  const target=budget?budget/dim:0, r2=v=>Math.round(v*100)/100;   // daily target from the fixed monthly amounts
  const per=lines.map((l,i)=>{ const s=sum(tx.filter(x=>x.lineId===l.id),x=>+x.amount), bud=budOf(l);
    return {l,i,s,bud,today:isNow?dayAmt(td,l.id):0,avg:lastDay?s/lastDay:0,left:bud-s}; });
  const dateDef=V.dailyDate&&V.dailyDate.slice(0,7)===m ? V.dailyDate : isNow?t:past?monthDay(m,dim):monthDay(m,1);

  const add=`<div class="card daily-add no-print"><h2>➕ Quick add</h2>

    <div class="daily-rows">${lines.map(l=>`<div class="daily-row"><b>${esc(l.name)}</b>
      <input type="number" step="0.01" min="0" inputmode="decimal" placeholder="Amount (${cur})" data-daily-amt="${l.id}">
      <input type="text" placeholder="Note (optional) — e.g. lunch, taxi to work" data-daily-note="${l.id}">

    <div class="hint">Type the amount and press Enter (or Add). Tap any amount in the list below to change or delete it.</div></div>`;

  const kpis=`<div class="grid kpis" style="margin-top:14px">
    ${isNow?`<div class="card kpi ${target?(dayAmt(td)>target+0.005?'bad':'ok'):''}"><div class="l">Today</div><div class="v">${fmt(dayAmt(td),cur)}</div><div class="s">${target?`of ${fmt(r2(target),cur)} daily target · ${dayAmt(td)>target+0.005?fmt(r2(dayAmt(td)-target),cur)+' over':fmt(r2(target-dayAmt(td)),cur)+' left today'}<br>`:''}${per.map(p=>`${esc(p.l.name)} ${fmt(p.today,cur)}${p.bud?' / '+fmt(r2(p.bud/dim),cur):''}`).join(' · ')}</div></div>`:''}
    <div class="card kpi"><div class="l">${isNow?'This month so far':ymLabel(m)}</div><div class="v">${fmt(spent,cur)}</div><div class="s">${per.map(p=>`${esc(p.l.name)} ${fmt(p.s,cur)}`).join(' · ')} · ${tx.length} entr${tx.length===1?'y':'ies'}</div></div>
    <div class="card kpi ${target&&lastDay?(avg>target+0.005?'bad':'ok'):''}"><div class="l">Average per day</div><div class="v">${fmt(r2(avg),cur)}</div><div class="s">${lastDay?`over ${lastDay} day(s)`:'month not started yet'}${target?` · target ${fmt(r2(target),cur)} a day (${fmt(budget,cur)} ÷ ${dim} days)`:''}</div></div>
    ${isNow?`<div class="card kpi"><div class="l">Month-end estimate</div><div class="v">${fmt(Math.round(proj),cur)}</div><div class="s">if you keep spending ${fmt(Math.round(avg*100)/100,cur)} a day</div></div>`:''}
    ${budget?`<div class="card kpi ${spent>budget?'bad':'ok'}"><div class="l">${spent>budget?'Over budget':'Left to spend'}</div><div class="v">${fmt(Math.abs(budget-spent),cur)}</div><div class="s">of ${fmt(budget,cur)}${daysLeft&&budget>spent?` · about ${fmt(Math.round((budget-spent)/daysLeft*100)/100,cur)} a day for ${daysLeft} day(s)`:''}</div></div>`
      :`<div class="card kpi"><div class="l">Monthly limit</div><div class="v muted">Not set</div><div class="s">Edit ${per.map(p=>esc(p.l.name)).join(' / ')} on the Budget tab to add one — then you see what is left per day</div></div>`}
  </div>`;

  // chart: one stacked bar per day, dashed line = daily average
  const W=1000,H=190,pl=50,pb=24,pt=10,cw=(W-pl-8)/dim,bw=Math.min(20,cw*.66);
  const max=Math.max(1,...Array.from({length:dim},(_,i)=>dayAmt(i+1)),avg*1.15,budget/dim*1.15), y=v=>pt+(H-pt-pb)*(1-v/max);
  let svg=`<div class="legend">${lines.map((l,i)=>`<span><i style="background:${COLORS[i%COLORS.length]}"></i>${esc(l.name)}</span>`).join('')}${lastDay?`<span><i style="background:var(--muted)"></i>Average ${fmt(Math.round(avg*100)/100,cur)} / day</span>`:''}</div>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:640px" role="img" aria-label="Spending per day">`;
  [0,.5,1].forEach(f=>{ svg+=`<line x1="${pl}" x2="${W-8}" y1="${y(f*max)}" y2="${y(f*max)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(f*max)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${Math.round(f*max)}</text>`; });
  for(let d=1; d<=dim; d++){ const x=pl+(d-1)*cw+cw/2-bw/2; let acc=0;
    lines.forEach((l,i)=>{ const v=dayAmt(d,l.id); if(!v) return; svg+=`<rect x="${x}" y="${y(acc+v)}" width="${bw}" height="${y(acc)-y(acc+v)}" fill="${COLORS[i%COLORS.length]}"><title>${d} ${ymLabel(m)} · ${esc(l.name)}: ${fmt(v,cur)}</title></rect>`; acc+=v; });
    svg+=`<text x="${pl+(d-1)*cw+cw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${isNow&&d===td?'var(--accent)':'var(--muted)'}" ${isNow&&d===td?'font-weight="700"':''}>${d}</text>`; }
  if(lastDay) svg+=`<line x1="${pl}" x2="${W-8}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--muted)" stroke-dasharray="5 4"/>`;
  if(target) svg+=`<line x1="${pl}" x2="${W-8}" y1="${y(target)}" y2="${y(target)}" stroke="var(--bad)" stroke-width="1.5"/><text x="${W-10}" y="${y(target)-5}" text-anchor="end" font-size="10.5" fill="var(--bad)">Daily target ${fmt(r2(target),cur)}</text>`;
  svg+='</svg></div>';

  // day list, newest first
  let run=0; const cum=[]; for(let d=1; d<=dim; d++){ run+=dayAmt(d); cum[d]=run; }
  const rows=[]; for(let d=lastDay; d>=1; d--){ const date=monthDay(m,d), wd=WDAY[parse(date).getDay()], tot=dayAmt(d);
    rows.push(`<tr class="${isNow&&d===td?'daily-today':''}${tot?'':' daily-none'}"><td class="nowrap"><b>${d}</b> ${wd}${isNow&&d===td?' <span class="tag">Today</span>':''}</td>
      ${lines.map(l=>{ const xs=(byDay.get(d)||[]).filter(x=>x.lineId===l.id);
        return `<td>${xs.map(x=>`<a class="daily-entry" data-act="exp-txn" data-b="${b.id}" data-t="${x.id}" title="Change or delete">${fmt(x.amount,cur)}${x.note?` <span class="sub">${esc(x.note)}</span>`:''}</a>`).join('')}<button class="icon-btn daily-plus no-print" title="Add ${esc(l.name)} for ${fmtDate(date)}" data-act="exp-txn" data-b="${b.id}" data-l="${l.id}" data-date="${date}">＋</button></td>`; }).join('')}
      <td class="num ${target&&tot?(tot>target+0.005?'neg':'pos'):''}">${tot?`<b>${fmt(tot,cur)}</b>`:'—'}${target&&tot?`<div class="sub">${tot>target+0.005?fmt(r2(tot-target),cur)+' over':fmt(r2(target-tot),cur)+' under'}</div>`:''}</td>
      <td class="num muted">${fmt(cum[d],cur)}${target?`<div class="sub ${cum[d]>target*d+0.005?'neg':''}">target ${fmt(Math.round(target*d),cur)}</div>`:''}</td></tr>`); }
  const table=`<div class="tbl-wrap" style="margin-top:14px"><table class="daily-table"><thead><tr><th>Day</th>${lines.map(l=>`<th>${esc(l.name)}</th>`).join('')}<th class="num">Day total${target?` <span class="sub">(target ${fmt(r2(target),cur)})</span>`:''}</th><th class="num">Month so far</th></tr></thead>
    <tbody>${rows.join('')||`<tr><td colspan="${lines.length+3}" class="empty">${ymLabel(m)} has not started yet.</td></tr>`}</tbody>
    ${lastDay?`<tfoot><tr><td><b>Total</b></td>${per.map(p=>`<td><b>${fmt(p.s,cur)}</b><div class="sub">${fmt(r2(p.avg),cur)} a day${p.bud?` · budget ${fmt(p.bud,cur)} (${fmt(r2(p.bud/dim),cur)} a day)`:''}</div></td>`).join('')}<td class="num"><b>${fmt(spent,cur)}</b></td><td></td></tr></tfoot>`:''}</table></div>`;

  return `${lastDay||!past?add:''}${kpis}<div class="card chart" style="margin-top:14px"><h2>Spending per day — ${ymLabel(m)}</h2>${svg}</div>${table}`;

/* ================= REPORTS =================

const REP_DEF = {tab:'txns',preset:'thisYear',from:'',to:'',country:'ALL',secs:[],book:'',line:'',cat:'',flow:'',method:'',q:'',min:'',max:'',
  group:'section',group2:'book',pivot:'section',measure:'out',cur:'LKR',status:'open',sort:'date',dir:'desc',limit:300};
const REP = Object.assign({}, REP_DEF, UI.rep||{}, {limit:300, printAll:false});

const REP_TABS = [['txns','💳 Transactions'],['summary','📊 Summary'],['monthly','📅 Month by month'],['dues','⏰ Bills & dues'],['balances','🏦 Balances']];

  type:['Type',r=>r.type], flow:['Money flow',r=>FLOW_LABEL[r.flow]], method:['Payment method',r=>r.method||'—'],
  country:['Country',r=>COUNTRIES[r.country]?.name||r.country], cur:['Currency',r=>r.cur], month:['Month',r=>r.ym], year:['Year',r=>r.year]};

const repConv = lkr => repCur()==='LKR' ? lkr : (rate('QAR') ? lkr/rate('QAR') : 0);
const repFmt = lkr => fmt(Math.round(repConv(lkr)*100)/100, repCur());
const isNumCol = c => ['m','a','n','p'].includes(c.t);

function repRange(){
  const t=today(), now=ymNow(), y=+t.slice(0,4), back=n=>[ymAdd(now,-n)+'-01', monthDay(now,31)];
  switch(REP.preset){
    case 'thisMonth': return back(0);
    case 'lastMonth': { const m=ymAdd(now,-1); return [m+'-01',monthDay(m,31)]; }
    case 'last3': return back(2); case 'last6': return back(5); case 'last12': return back(11);
    case 'thisYear': return [y+'-01-01',y+'-12-31'];
    case 'lastYear': return [(y-1)+'-01-01',(y-1)+'-12-31'];
    case 'custom': return [REP.from||'0000-01-01', REP.to||'9999-12-31'];
    default: return ['0000-01-01','9999-12-31'];
  }
}
function repRangeText(){
  const [a,b]=repRange(), open=a<'1900', end=b>'9000';
  if(open&&end) return 'All time';
  return `${open?'Beginning':fmtDate(a)} – ${end?'today':fmtDate(b)}`;
}

/* every payment, deposit, expense… as one flat row */
function repLedger(){
  const out=[];
  const add=(b,o)=>{ if(!o.date) return; const s=secOf(b), cur=o.cur||b.currency||(b.type==='debt'?'QAR':'LKR'), amount=+o.amount||0;
    out.push({id:o.id,date:o.date,ym:o.date.slice(0,7),year:o.date.slice(0,4),b,bookId:b.id,book:b.name,secId:s.id,sec:s.name,secIcon:s.icon,kind:b.type,
      country:countryOf(b),cur,amount,lkr:o.lkr ?? amount*rate(cur),item:o.item||'',lineKey:o.lineKey||'',cat:o.cat||'',type:o.type,flow:o.flow,
      method:o.method||'',ref:o.ref||'',note:o.note||'',files:o.files||[]}); };
  for(const b of S.books){
    if(b.type==='course') for(const it of b.items||[]) for(const p of it.payments||[]){ const cur=it.currency||'LKR';
      add(b,{id:p.id,date:p.date,amount:p.amount,cur,lkr:(+p.amount||0)*(cur==='LKR'?1:(+p.rate||rate(cur))),item:it.title,lineKey:b.id+':i:'+it.id,cat:it.category,
        type:'Payment',flow:'out',method:p.method,ref:p.ref,note:p.note,files:p.files}); }
    else if(b.type==='saving') for(const x of b.txns||[])
      add(b,{...x,item:txnLabel(b,x.type),lineKey:b.id+':t:'+x.type,cat:isChit(b)?'Seettu / chit fund':'Savings',type:txnLabel(b,x.type),flow:x.type==='deposit'?'out':'in'});
    else if(b.type==='debt') for(const x of b.txns||[])
      add(b,{...x,item:TXN_LABEL[x.type],lineKey:b.id+':t:'+x.type,cat:'Card / loan',type:x.type==='payment'?'Card payment':TXN_LABEL[x.type],flow:x.type==='payment'?'out':'charge'});
    else if(b.type==='expense') for(const x of b.txns||[]){ const l=(b.lines||[]).find(l=>l.id===x.lineId);
      add(b,{...x,item:l?l.name:'Unplanned / other',lineKey:b.id+':l:'+(l?l.id:''),cat:l?.category||'Other',type:'Expense',flow:'out'}); }
  }
  return out;
}
function repBooks(ignoreBook){
  return S.books.filter(b=>(REP.country==='ALL'||countryOf(b)===REP.country) && (!REP.secs.length||REP.secs.includes(secOf(b).id)) && (ignoreBook||!REP.book||b.id===REP.book));
}
function repMatchQ(text){ const q=REP.q.trim().toLowerCase(); return !q || text.toLowerCase().includes(q); }
function repRows(ledger){
  const [from,to]=repRange(), ids=new Set(repBooks().map(b=>b.id)), min=REP.min===''?null:+REP.min, max=REP.max===''?null:+REP.max;
  return (ledger||repLedger()).filter(r=>ids.has(r.bookId) && r.date>=from && r.date<=to && (!REP.line||r.lineKey===REP.line) && (!REP.cat||r.cat===REP.cat)
    && (!REP.flow||r.flow===REP.flow) && (!REP.method||(r.method||'—')===REP.method) && (min===null||r.amount>=min) && (max===null||r.amount<=max)
    && repMatchQ([r.book,r.sec,r.item,r.cat,r.type,r.method,r.ref,r.note,r.amount].join(' ')));
}
/* drop filter values that no longer exist (deleted section, item from another country…) */
function repFix(ledger){
  REP.secs=REP.secs.filter(id=>S.sections.some(s=>s.id===id));
  if(REP.book && !repBooks(true).some(b=>b.id===REP.book)) REP.book='';
  const ids=new Set(repBooks().map(b=>b.id)), inScope=ledger.filter(r=>ids.has(r.bookId));
  if(REP.line && !inScope.some(r=>r.lineKey===REP.line)) REP.line='';
  if(REP.cat && !inScope.some(r=>r.cat===REP.cat)) REP.cat='';
  if(REP.method && !inScope.some(r=>(r.method||'—')===REP.method)) REP.method='';
  if(!REP_TABS.some(([id])=>id===REP.tab)) REP.tab='txns';
  return inScope;
}
function repAgg(rs){ const o=rs.filter(r=>r.flow==='out');
  return {n:rs.length,nOut:o.length,out:sum(o,r=>r.lkr),in:sum(rs.filter(r=>r.flow==='in'),r=>r.lkr),ch:sum(rs.filter(r=>r.flow==='charge'),r=>r.lkr)}; }
function repGroup(rows,dim){ const f=REP_DIMS[dim][1], m=new Map();
  for(const r of rows){ const k=f(r); let g=m.get(k); if(!g) m.set(k,g={key:k,rows:[]}); g.rows.push(r); }
  const gs=[...m.values()].map(g=>({...g,a:repAgg(g.rows)}));
  return dim==='month'||dim==='year' ? gs.sort((a,b)=>a.key.localeCompare(b.key)) : gs.sort((a,b)=>b.a.out-a.a.out||b.a.in-a.a.in||String(a.key).localeCompare(String(b.key)));
}
const repDimLabel = (dim,k) => dim==='month' ? ymLabel(k) : k;
/* months covered by the period — open-ended periods use the months that have data, never far into the future */
function repMonths(rows){
  const [from,to]=repRange(), yms=rows.map(r=>r.ym).sort(), now=ymNow();
  let a=from.slice(0,7), b=to.slice(0,7);
  if(a<'1900') a=yms[0]||now;
  const lastData=yms[yms.length-1]||now; b=[b, lastData>now?lastData:now].sort()[0];
  if(b<a) b=a; const all=ymRange(a,b); return all.slice(-120);
}

  return {title:'Transactions',cols,rows:out,foot,sortable:true};
}
function repSummaryModel(rows,group=REP.group,group2=REP.group2){
  if(group2===group) group2='';
  const hasCh=rows.some(r=>r.flow==='charge'), T=repAgg(rows), cv=repConv;
  const cols=[{h:REP_DIMS[group][0]+(group2?' › '+REP_DIMS[group2][0]:''),t:'s',w:3,ind:true},{h:'Records',t:'n',w:.8},{h:'Money out',t:'m',w:1.4},{h:'Money in',t:'m',w:1.4},
    ...(hasCh?[{h:'Card charges & fees',t:'m',w:1.4}]:[]),{h:'Net (in − out)',t:'m',w:1.4},{h:'Share of money out',t:'p',w:1.1},{h:'Average payment',t:'m',w:1.3}];
  const si=cols.length-2, ni=cols.length-3;
  const mk=(label,a,extra={})=>{ const share=T.out?a.out/T.out:null;
    return {...extra,c:[label,a.n,a.out?cv(a.out):null,a.in?cv(a.in):null,...(hasCh?[a.ch?cv(a.ch):null]:[]),cv(a.in-a.out),share,a.nOut?cv(a.out/a.nOut):null],
      h:{[si]:share==null?'':`${pctBar(share*100)}<div class="sub">${Math.round(share*100)}%</div>`},cls:{[ni]:a.in-a.out<0?'neg':'pos'}}; };
  const out=[];
