<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecff"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- full-bleed background (iOS rounds the corners itself) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- rising chart line behind the wallet -->
  <polyline points="214,300 360,232 470,268 640,170 800,128" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="128" r="26" fill="#ffffff" fill-opacity="0.35"/>

  <!-- wallet -->
  <g filter="url(#shadow)">
    <rect x="238" y="318" width="520" height="120" rx="48" fill="#c7d2fe"/>
    <rect x="196" y="364" width="632" height="452" rx="76" fill="url(#wallet)"/>
    <rect x="632" y="500" width="232" height="176" rx="58" fill="#dfe5ff"/>
    <circle cx="712" cy="588" r="30" fill="#4f46e5"/>
  </g>
  <rect x="196" y="364" width="632" height="54" rx="27" fill="#4f46e5" fill-opacity="0.08"/>

  <!-- gold coin -->
  <g filter="url(#shadow)">
    <circle cx="420" cy="590" r="164" fill="url(#coin)"/>
  </g>
  <circle cx="420" cy="590" r="128" fill="none" stroke="#fff7d6" stroke-opacity="0.75" stroke-width="10"/>
  <text x="420" y="638" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="138" fill="#92400e" letter-spacing="-4">Rs</text>
</svg>
